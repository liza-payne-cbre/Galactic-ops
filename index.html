<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galactic Operations Task &amp; Credit Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700;800&family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['Oxanium', 'Trebuchet MS', 'sans-serif'],
          body: ['"Chakra Petch"', 'Segoe UI', 'system-ui', 'sans-serif']
        }
      }
    }
  };
</script>
<style>
  :root { --void:#0b0f19; --cyan:#06b6d4; --amber:#f59e0b; --panel:#1e293b; }
  html { background: var(--void); }
  body {
    font-family: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
    color: #cbd5e1;
    min-height: 100vh;
    background:
      radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.55), transparent 60%),
      radial-gradient(1px 1px at 72% 12%, rgba(255,255,255,.4), transparent 60%),
      radial-gradient(1.5px 1.5px at 40% 66%, rgba(103,232,249,.5), transparent 60%),
      radial-gradient(1px 1px at 88% 52%, rgba(255,255,255,.45), transparent 60%),
      radial-gradient(1px 1px at 22% 84%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(1.5px 1.5px at 60% 34%, rgba(253,230,138,.4), transparent 60%),
      radial-gradient(1200px 600px at 80% -10%, rgba(6,182,212,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(245,158,11,.06), transparent 60%),
      var(--void);
    background-attachment: fixed;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 60;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);
  }
  .glow-text { text-shadow: 0 0 10px rgba(6,182,212,.55); }
  .glow-amber { text-shadow: 0 0 12px rgba(245,158,11,.5); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 6px; }

  /* Blueprint SVG parts */
  .part-locked { opacity: .55; }
  .part-locked * {
    fill: none !important; stroke: var(--cyan) !important;
    stroke-dasharray: 4 3; stroke-opacity: .5; stroke-width: 1.5 !important;
    animation: none !important;
  }
  .part-new { animation: materialize 1.1s ease-out; transform-box: fill-box; transform-origin: center; }
  .blink { animation: blink 1.6s steps(2, end) infinite; }
  .pulse-core { animation: pulseCore 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .scan { animation: scan 2.6s ease-in-out infinite alternate; }
  .victory { animation: float 3.2s ease-in-out infinite; }
  .halo { animation: halo 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .twinkle { animation: twinkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

  @keyframes materialize {
    0% { opacity: 0; transform: scale(.7); filter: brightness(3) drop-shadow(0 0 8px #06b6d4); }
    60% { opacity: 1; filter: brightness(1.8) drop-shadow(0 0 6px #06b6d4); }
    100% { transform: scale(1); filter: none; }
  }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes pulseCore { 50% { transform: scale(1.12); opacity: .8; } }
  @keyframes scan { from { transform: translateX(0); } to { transform: translateX(34px); } }
  @keyframes float { 50% { transform: translateY(-6px); } }
  @keyframes halo { 50% { opacity: .5; transform: scale(1.06); } }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.4); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes confetti { to { transform: translate(var(--dx), 105vh) rotate(720deg); opacity: .8; } }

  .confetti-bit { position: fixed; top: -12px; width: 8px; height: 14px; z-index: 70; pointer-events: none; animation: confetti var(--t) cubic-bezier(.2,.6,.4,1) forwards; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
<style type="text/tailwindcss">
  .panel { @apply rounded-2xl border border-cyan-500/20 bg-slate-800/70 backdrop-blur-sm shadow-[inset_0_0_30px_rgba(6,182,212,.06)]; }
  .panel-title { @apply font-display text-lg font-semibold tracking-wide text-cyan-200; }
  .label { @apply text-xs text-slate-400; }
  .btn { @apply inline-flex items-center justify-center gap-1 whitespace-nowrap rounded-lg border px-3 py-1.5 font-display text-xs font-semibold tracking-wider transition; }
  .btn-cyan { @apply border-cyan-500/60 bg-cyan-500/10 text-cyan-200 hover:bg-cyan-500/25 hover:shadow-[0_0_14px_rgba(6,182,212,.35)]; }
  .btn-amber { @apply border-amber-500/60 bg-amber-500/10 text-amber-200 hover:bg-amber-500/25 hover:shadow-[0_0_14px_rgba(245,158,11,.35)]; }
  .btn-red { @apply border-rose-500/50 bg-rose-500/10 text-rose-200 hover:bg-rose-500/20; }
  .btn-ghost { @apply border-slate-600 bg-slate-900/40 text-slate-300 hover:border-cyan-500/50 hover:text-cyan-200; }
  .field { @apply rounded-lg border border-slate-600 bg-[#0b0f19]/80 px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:border-cyan-500 focus:outline-none focus:ring-1 focus:ring-cyan-500/60; }
  .row { @apply flex flex-wrap items-center gap-3 rounded-xl border border-slate-700/60 bg-slate-900/55 p-3; }
  .chip { @apply inline-flex items-center rounded-md border px-2 py-0.5 text-[11px] font-medium; }
  .chip-cyan { @apply border-cyan-500/40 bg-cyan-500/10 text-cyan-200; }
  .chip-amber { @apply border-amber-500/50 bg-amber-500/10 text-amber-200; }
  .chip-slate { @apply border-slate-500/50 bg-slate-700/40 text-slate-300; }
  .chip-green { @apply border-emerald-500/40 bg-emerald-500/10 text-emerald-200; }
  .credit { @apply font-display text-sm font-bold text-amber-400; }
  .empty { @apply rounded-xl border border-dashed border-slate-700 p-4 text-center text-sm text-slate-500; }
  .icon-btn { @apply grid h-7 w-7 place-items-center rounded-md border border-slate-700 text-slate-400 hover:border-rose-500/60 hover:text-rose-300; }
  .bar { @apply h-2 w-full overflow-hidden rounded-full bg-slate-900/80 ring-1 ring-slate-700; }
  .bar > span { @apply block h-full rounded-full bg-gradient-to-r from-cyan-500 to-amber-400 transition-all duration-700; }
  .dir-item { @apply flex w-full items-center gap-3 rounded-xl border border-slate-700/70 bg-slate-900/50 p-3 text-left transition hover:border-cyan-500/60; }
  .dir-item .box { @apply grid h-6 w-6 shrink-0 place-items-center rounded-md border-2 border-cyan-500/60 text-sm font-bold; }
  .dir-item.pending { @apply border-amber-500/50 bg-amber-500/5; }
  .dir-item.pending .box { @apply border-amber-400 text-amber-300; }
  .dir-item.approved { @apply cursor-default border-cyan-500/50 bg-cyan-500/10; }
  .dir-item.approved .box { @apply border-cyan-400 bg-cyan-500 text-slate-950; }
  .switch-btn { @apply flex shrink-0 items-center gap-2 rounded-lg border px-3 py-2 text-left transition; }
  .switch-btn[aria-current="true"] { @apply border-cyan-400 bg-cyan-500/15 shadow-[0_0_16px_rgba(6,182,212,.3)]; }
  .switch-btn:not([aria-current="true"]) { @apply border-slate-700 bg-slate-900/50 hover:border-cyan-500/50; }
  .subhead { @apply mb-2 mt-5 font-display text-sm font-semibold text-slate-200 first:mt-0; }
</style>
</head>
<body>

<header class="sticky top-0 z-30 border-b border-cyan-500/20 bg-[#0b0f19]/85 backdrop-blur">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-3">
    <div class="flex items-center gap-3">
      <svg viewBox="0 0 48 48" class="h-10 w-10 shrink-0" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="#06b6d4" stroke-width="2" opacity=".7"/>
        <circle cx="24" cy="24" r="14" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
        <path d="M24 6 L27 21 L42 24 L27 27 L24 42 L21 27 L6 24 L21 21 Z" fill="#06b6d4"/>
        <circle cx="24" cy="24" r="3" fill="#0b0f19" stroke="#f59e0b" stroke-width="1.5"/>
      </svg>
      <div>
        <h1 class="font-display text-base font-extrabold tracking-[.18em] text-cyan-300 glow-text sm:text-xl">GALACTIC OPERATIONS</h1>
        <p class="text-xs text-slate-400"><span id="teamName">Task and Credit Tracker</span> <span class="text-slate-600">|</span> <span id="stardate" class="text-amber-300/80"></span></p>
      </div>
    </div>
    <nav id="switcher" class="flex max-w-full gap-2 overflow-x-auto pb-1" aria-label="Switch profile"></nav>
  </div>
</header>

<main id="app" class="mx-auto max-w-7xl px-4 py-6"></main>

<footer class="mx-auto max-w-7xl px-4 pb-8 text-xs text-slate-600">
  All data is stored locally in this browser. Use Export in the Commander's System panel to back up or move devices.
</footer>

<dialog id="missionDialog" aria-labelledby="missionDialogTitle" class="w-[min(36rem,calc(100vw-2rem))] max-h-[85vh] overflow-y-auto rounded-2xl border border-cyan-500/40 bg-[#0f1626] p-0 text-slate-200 shadow-[0_0_40px_rgba(6,182,212,.25)] backdrop:bg-black/70 backdrop:backdrop-blur-sm">
  <div id="missionDialogBody"></div>
</dialog>

<div id="toasts" class="fixed bottom-4 right-4 z-50 flex max-w-sm flex-col gap-2" aria-live="polite"></div>
<input type="file" id="importFile" class="hidden">

<script>
(() => {
  'use strict';

  /* ---------- Utilities ---------- */
  const STORE_KEY = 'galops-tracker-v1';
  const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
  const pad = n => String(n).padStart(2, '0');
  const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayKey = () => dateKey();
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = k => new Date(k + 'T00:00:00').toLocaleDateString([], { month: 'short', day: 'numeric' });
  const fmtTs = ts => new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  const toInt = (v, min = 0, fallback = 0) => { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.max(min, n) : fallback; };

  /* ---------- Avatars (original designs) ---------- */
  const AVATARS = {
    droid: {
      label: 'Utility Droid',
      stages: ['Core chassis', 'Torso frame', 'Motor arms', 'Scanner head', 'Fully assembled'],
      parts: () => [
        // 0: tread chassis
        `<rect x="92" y="148" width="16" height="24" rx="3" fill="#334155" stroke="#64748b" stroke-width="2"/>
         <rect x="46" y="168" width="108" height="30" rx="15" fill="#1f2937" stroke="#94a3b8" stroke-width="2"/>
         <rect x="58" y="163" width="84" height="6" rx="3" fill="#f59e0b"/>
         <circle cx="64" cy="183" r="9" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
         <circle cx="100" cy="183" r="9" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
         <circle cx="136" cy="183" r="9" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
         <circle cx="64" cy="183" r="3" fill="#06b6d4"/><circle cx="100" cy="183" r="3" fill="#06b6d4"/><circle cx="136" cy="183" r="3" fill="#06b6d4"/>`,
        // 1: torso
        `<rect x="58" y="94" width="84" height="58" rx="12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
         <rect x="66" y="102" width="32" height="22" rx="4" fill="#0f172a"/>
         <rect x="70" y="106" width="7" height="5" rx="1" fill="#06b6d4" class="blink"/>
         <rect x="80" y="106" width="7" height="5" rx="1" fill="#f59e0b"/>
         <rect x="70" y="114" width="17" height="5" rx="1" fill="#22d3ee" opacity=".6"/>
         <circle cx="121" cy="120" r="11" fill="#f59e0b" stroke="#92400e" stroke-width="2" class="pulse-core"/>
         <rect x="66" y="132" width="40" height="4" rx="2" fill="#64748b"/>
         <rect x="66" y="140" width="26" height="4" rx="2" fill="#64748b"/>
         <rect x="112" y="138" width="22" height="8" rx="2" fill="#475569"/>`,
        // 2: arms
        `<circle cx="56" cy="106" r="7" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
         <rect x="34" y="101" width="22" height="10" rx="5" fill="#94a3b8"/>
         <rect x="30" y="101" width="10" height="36" rx="5" fill="#94a3b8"/>
         <path d="M31 137 L24 148 M39 137 L46 148" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none"/>
         <circle cx="144" cy="106" r="7" fill="#64748b" stroke="#94a3b8" stroke-width="2"/>
         <rect x="144" y="101" width="22" height="10" rx="5" fill="#94a3b8"/>
         <rect x="160" y="101" width="10" height="36" rx="5" fill="#94a3b8"/>
         <path d="M161 137 L154 148 M169 137 L176 148" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none"/>`,
        // 3: head
        `<rect x="94" y="86" width="12" height="10" fill="#64748b"/>
         <rect x="64" y="46" width="72" height="42" rx="14" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
         <rect x="72" y="58" width="56" height="16" rx="8" fill="#0f172a"/>
         <rect x="76" y="61" width="14" height="10" rx="5" fill="#06b6d4" class="scan"/>
         <line x1="122" y1="46" x2="132" y2="24" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
         <circle cx="133" cy="21" r="5" fill="#f59e0b" class="blink"/>
         <rect x="72" y="79" width="22" height="4" rx="2" fill="#94a3b8"/>
         <circle cx="122" cy="81" r="3" fill="#06b6d4"/>`
      ]
    },
    axolotl: {
      label: 'Cyber Axolotl',
      stages: ['Bio-pod base', 'Body frame', 'Limbs and fins', 'Head and gills', 'Fully assembled'],
      parts: () => [
        // 0: hover pod
        `<ellipse cx="100" cy="200" rx="74" ry="11" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
         <path d="M50 194 L60 176 L140 176 L150 194 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>
         <ellipse cx="100" cy="176" rx="40" ry="5" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
         <circle cx="76" cy="186" r="3" fill="#06b6d4" class="blink"/>
         <circle cx="100" cy="186" r="3" fill="#f59e0b"/>
         <circle cx="124" cy="186" r="3" fill="#06b6d4" class="blink"/>`,
        // 1: body + tail
        `<path d="M140 136 C164 130 178 112 192 96 C188 124 172 150 140 158 Z" fill="#f9a8d4" stroke="#db2777" stroke-width="2"/>
         <ellipse cx="108" cy="148" rx="46" ry="23" fill="#f9a8d4" stroke="#db2777" stroke-width="2"/>
         <ellipse cx="104" cy="157" rx="30" ry="9" fill="#fbcfe8"/>
         <path d="M86 138 h16 v8 h18" stroke="#06b6d4" stroke-width="2" fill="none"/>
         <circle cx="122" cy="146" r="3" fill="#06b6d4" class="blink"/>
         <path d="M148 140 l10 -4" stroke="#06b6d4" stroke-width="2" fill="none"/>`,
        // 2: legs + fins
        `<rect x="76" y="160" width="10" height="18" rx="5" fill="#f472b6" stroke="#db2777" stroke-width="2"/>
         <rect x="94" y="164" width="10" height="14" rx="5" fill="#f472b6" stroke="#db2777" stroke-width="2"/>
         <rect x="120" y="162" width="10" height="16" rx="5" fill="#f472b6" stroke="#db2777" stroke-width="2"/>
         <rect x="136" y="156" width="10" height="20" rx="5" fill="#f472b6" stroke="#db2777" stroke-width="2"/>
         <path d="M150 128 C168 118 180 102 192 90 C192 104 182 122 164 134 Z" fill="#22d3ee" fill-opacity=".85" stroke="#06b6d4" stroke-width="2"/>
         <path d="M92 128 C102 114 120 114 132 128" fill="#22d3ee" fill-opacity=".85" stroke="#06b6d4" stroke-width="2"/>`,
        // 3: head + gills
        `<g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" fill="none">
           <path d="M42 112 C34 102 30 94 26 84"/><path d="M38 122 C28 118 20 114 12 110"/><path d="M40 134 C30 136 22 140 14 146"/>
           <path d="M82 112 C90 102 94 94 98 84"/><path d="M86 122 C96 118 104 114 110 108"/>
         </g>
         <circle cx="26" cy="84" r="3" fill="#06b6d4"/><circle cx="12" cy="110" r="3" fill="#06b6d4"/><circle cx="14" cy="146" r="3" fill="#06b6d4"/>
         <circle cx="98" cy="84" r="3" fill="#06b6d4"/><circle cx="110" cy="108" r="3" fill="#06b6d4"/>
         <ellipse cx="62" cy="130" rx="30" ry="24" fill="#f9a8d4" stroke="#db2777" stroke-width="2"/>
         <circle cx="51" cy="124" r="5" fill="#0f172a"/><circle cx="52.6" cy="122.4" r="1.7" fill="#fff"/>
         <circle cx="73" cy="124" r="5" fill="#0f172a"/><circle cx="74.6" cy="122.4" r="1.7" fill="#fff"/>
         <path d="M53 138 Q62 145 71 138" stroke="#9d174d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
         <circle cx="62" cy="110" r="3.5" fill="#06b6d4" class="blink"/>
         <ellipse cx="44" cy="134" rx="4" ry="2.5" fill="#f472b6"/><ellipse cx="80" cy="134" rx="4" ry="2.5" fill="#f472b6"/>`
      ]
    }
  };

  const sparkles = () => [[30, 40, 0], [170, 50, .5], [24, 160, 1], [178, 150, .3], [100, 18, .8], [150, 196, 1.2]]
    .map(([x, y, d]) => `<path class="twinkle" style="animation-delay:${d}s" d="M${x} ${y - 7} L${x + 2} ${y - 2} L${x + 7} ${y} L${x + 2} ${y + 2} L${x} ${y + 7} L${x - 2} ${y + 2} L${x - 7} ${y} L${x - 2} ${y - 2} Z" fill="#fde68a"/>`).join('');

  function avatarSVG(type, pct, { sfx = 'a', newPart = -1, cls = '' } = {}) {
    const av = AVATARS[type] || AVATARS.droid;
    const complete = pct >= 100;
    const parts = av.parts().map((p, i) => {
      const on = complete || pct >= i * 25;
      return `<g class="${on ? 'part-on' : 'part-locked'} ${i === newPart ? 'part-new' : ''}">${p}</g>`;
    }).join('');
    return `<svg viewBox="0 0 200 220" class="${cls}" role="img" aria-label="${av.label}, ${pct}% assembled">
      <defs>
        <pattern id="grid-${sfx}" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#06b6d4" stroke-opacity=".12"/></pattern>
        <filter id="glow-${sfx}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <radialGradient id="halo-${sfx}"><stop offset="0" stop-color="#06b6d4" stop-opacity=".45"/><stop offset=".6" stop-color="#f59e0b" stop-opacity=".12"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="200" height="220" fill="url(#grid-${sfx})"/>
      ${complete ? `<circle cx="100" cy="125" r="96" fill="url(#halo-${sfx})" class="halo"/>` : ''}
      <g class="${complete ? 'victory' : ''}" ${complete ? `filter="url(#glow-${sfx})"` : ''}>${parts}</g>
      ${complete ? sparkles() : ''}
    </svg>`;
  }

  /* ---------- State ---------- */
  function defaultState() {
    const now = Date.now();
    return {
      version: 1,
      view: 'cmd',
      commander: { name: 'Commander' },
      settings: { teamName: 'Task and Credit Tracker', currency: '', pointsPerUnit: 0 },
      operatives: [
        { id: 'op1', name: 'Operative Kael', callsign: 'ALPHA-1', credits: 0, directives: [], log: {}, goal: { avatar: 'droid', name: 'Utility Droid', target: 150 }, celebrated: false, lastUnlocked: null },
        { id: 'op2', name: 'Operative Nyra', callsign: 'BRAVO-2', credits: 0, directives: [], log: {}, goal: { avatar: 'axolotl', name: 'Cyber Axolotl', target: 200 }, celebrated: false, lastUnlocked: null },
        { id: 'op3', name: 'Operative Dax', callsign: 'CHARLIE-3', credits: 0, directives: [], log: {}, goal: { avatar: 'droid', name: 'Utility Droid', target: 250 }, celebrated: false, lastUnlocked: null }
      ],
      missions: [
        { id: uid(), title: 'Restock the supply bay', details: 'Break room supplies and printer paper.', credits: 15, status: 'open', assignee: null, createdAt: now },
        { id: uid(), title: 'Archive old holo-records', details: 'Move closed project files into the archive folder.', credits: 25, status: 'open', assignee: null, createdAt: now },
        { id: uid(), title: 'Recon report on client feedback', details: 'One-page summary of themes from last week.', credits: 30, status: 'open', assignee: null, createdAt: now },
        { id: uid(), title: 'Run diagnostics on the shared printer', details: '', credits: 10, status: 'open', assignee: null, createdAt: now }
      ],
      ledger: []
    };
  }

  function migrate(s) {
    const d = defaultState();
    s.version = 1;
    s.view = s.view || 'cmd';
    s.commander = s.commander || d.commander;
    s.settings = Object.assign({ teamName: 'Task and Credit Tracker', currency: '', pointsPerUnit: 0 }, s.settings || {});
    s.missions = Array.isArray(s.missions) ? s.missions : [];
    s.missions.forEach(m => { m.category = m.category || ''; m.details = m.details || ''; m.repeatable = !!m.repeatable; });
    s.ledger = Array.isArray(s.ledger) ? s.ledger : [];
    if (!Array.isArray(s.operatives) || !s.operatives.length) s.operatives = d.operatives;
    const cutoff = dateKey(new Date(Date.now() - 60 * 864e5));
    s.operatives.forEach((o, i) => {
      o.id = o.id || 'op' + (i + 1);
      o.credits = Number.isFinite(o.credits) ? o.credits : 0;
      o.directives = Array.isArray(o.directives) ? o.directives : [];
      o.log = o.log || {};
      Object.keys(o.log).forEach(k => { if (k < cutoff) delete o.log[k]; });
      o.goal = Object.assign({ avatar: 'droid', name: 'Utility Droid', target: 150 }, o.goal || {});
      if (!AVATARS[o.goal.avatar]) o.goal.avatar = 'droid';
      o.lastUnlocked = o.lastUnlocked ?? null;
    });
    if (s.view !== 'cmd' && !s.operatives.some(o => o.id === s.view)) s.view = 'cmd';
    return s;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return migrate(JSON.parse(raw));
    } catch (e) { console.warn('Load failed', e); }
    return defaultState();
  }

  let storageWarned = false;
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
    catch (e) { if (!storageWarned) { toast('Browser storage is unavailable, so changes will not persist.', 'warn'); storageWarned = true; } }
  }

  let state = load();
  const ui = { missionFilter: 'active' };

  const getOp = id => state.operatives.find(o => o.id === id);
  const getMission = id => state.missions.find(m => m.id === id);

  const sameTitle = (a, b) => String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
  const openCopyExists = m => state.missions.some(x => x.status === 'open' && sameTitle(x.title, m.title));
  function repeatMission(m) {
    state.missions.push({ id: uid(), title: m.title, details: m.details || '', category: m.category || '', credits: m.credits, repeatable: !!m.repeatable, status: 'open', assignee: null, createdAt: Date.now() });
  }
  function money(cr) {
    const st = state.settings;
    return st && st.currency && st.pointsPerUnit > 0 ? `${st.currency}${(cr / st.pointsPerUnit).toFixed(2)}` : '';
  }

  /* Converts a backup from the earlier tracker build (users / tasks / points, schema v3) */
  const CALLSIGNS = ['ALPHA-1', 'BRAVO-2', 'CHARLIE-3', 'DELTA-4', 'ECHO-5', 'FOXTROT-6'];
  const isLegacy = d => d && Array.isArray(d.users) && Array.isArray(d.tasks) && !Array.isArray(d.operatives);
  function convertLegacy(d) {
    const toMs = v => { const n = typeof v === 'number' ? v : Date.parse(v); return Number.isFinite(n) ? n : Date.now(); };
    const mgr = d.users.find(u => ['manager', 'admin', 'commander'].includes(String(u.role).toLowerCase()));
    const members = d.users.filter(u => u !== mgr);
    const NEG = ['spend', 'redeem', 'redemption', 'deduct', 'deduction', 'penalty', 'withdraw', 'payout'];
    const label = src => ({ task: 'Mission', directive: 'Directive', daily: 'Directive', bonus: 'Bonus', goal: 'Goal redeemed' }[src] || (src ? src[0].toUpperCase() + src.slice(1) : 'Adjustment'));
    const ledger = (d.ledger || []).map(l => {
      let amount = Number(l.points) || 0;
      if (NEG.includes(String(l.type).toLowerCase()) && amount > 0) amount = -amount;
      return { id: l.id || uid(), opId: l.userId, amount, reason: l.title ? `${label(l.source)}: ${l.title}` : label(l.source), ts: toMs(l.at) };
    }).sort((a, b) => b.ts - a.ts);
    const operatives = members.map((u, i) => {
      const g = (d.goals || {})[u.id] || {};
      const avatar = AVATARS[g.blueprint] ? g.blueprint : 'droid';
      return {
        id: u.id, name: u.name || `Operative ${i + 1}`, callsign: CALLSIGNS[i] || `OP-${i + 1}`,
        credits: ledger.filter(l => l.opId === u.id).reduce((a, l) => a + l.amount, 0),
        directives: [], log: {},
        goal: { avatar, name: g.name || AVATARS[avatar].label, target: Math.max(1, Number(g.target) || 150) },
        celebrated: false, lastUnlocked: null
      };
    });
    const STAT = { open: 'open', in_progress: 'claimed', claimed: 'claimed', submitted: 'pending', pending: 'pending', review: 'pending', done: 'approved', approved: 'approved', complete: 'approved', completed: 'approved' };
    const missions = d.tasks.map(t => {
      let status = STAT[t.status] || 'open';
      const assignee = status === 'open' ? null : (t.assignee || null);
      if (!assignee) status = 'open';
      const m = { id: t.id || uid(), title: t.title || 'Untitled mission', details: t.description || '', category: t.category || '', credits: Math.max(0, Number(t.points) || 0), repeatable: false, status, assignee, createdAt: toMs(t.createdAt) };
      if (t.claimedAt) m.claimedAt = toMs(t.claimedAt);
      if (t.submittedAt) m.submittedAt = toMs(t.submittedAt);
      if (t.approvedAt) m.approvedAt = toMs(t.approvedAt);
      return m;
    });
    const st = d.settings || {};
    return migrate({
      version: 1, view: 'cmd',
      commander: { name: (mgr && mgr.name) || 'Commander' },
      settings: { teamName: st.teamName || 'Task and Credit Tracker', currency: st.currency || '', pointsPerUnit: Number(st.pointsPerUnit) || 0 },
      operatives, missions, ledger,
      archive: { importedAt: Date.now(), sourceVersion: d.version ?? null, original: d }
    });
  }
  window.GalacticOps = { convertLegacy, isLegacy };

  function credit(op, amount, reason) {
    op.credits += amount;
    state.ledger.unshift({ id: uid(), opId: op.id, amount, reason, ts: Date.now() });
    if (state.ledger.length > 600) state.ledger.length = 600;
  }

  function getQueue() {
    const items = [];
    state.missions.filter(m => m.status === 'pending').forEach(m =>
      items.push({ kind: 'mission', id: m.id, opId: m.assignee, title: m.title, credits: m.credits, ts: m.submittedAt || 0 }));
    return items.sort((a, b) => a.ts - b.ts);
  }

  const goalPct = op => op.goal.target > 0 ? Math.min(100, Math.max(0, Math.floor(op.credits / op.goal.target * 100))) : 0;
  const unlockedCount = pct => pct >= 100 ? 4 : Math.floor(pct / 25) + 1;

  /* ---------- UI helpers ---------- */
  function toast(msg, tone = 'ok') {
    const el = document.createElement('div');
    const border = tone === 'warn' ? 'border-rose-500/60' : tone === 'gold' ? 'border-amber-400/70' : 'border-cyan-500/50';
    el.className = `panel px-4 py-3 text-sm text-slate-100 ${border}`;
    el.style.animation = 'toastIn .25s ease-out';
    el.textContent = msg;
    document.getElementById('toasts').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; }, 3000);
    setTimeout(() => el.remove(), 3500);
  }

  function confetti() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colors = ['#06b6d4', '#f59e0b', '#67e8f9', '#fde68a', '#f9a8d4'];
    for (let i = 0; i < 70; i++) {
      const b = document.createElement('span');
      b.className = 'confetti-bit';
      b.style.left = Math.random() * 100 + 'vw';
      b.style.background = colors[i % colors.length];
      b.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      b.style.setProperty('--t', (1.8 + Math.random() * 1.6) + 's');
      b.style.animationDelay = Math.random() * .4 + 's';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 4200);
    }
  }

  const panel = (title, sub, inner, extra = '') => `
    <section class="panel p-5">
      <div class="mb-4 flex flex-wrap items-start justify-between gap-3">
        <div><h3 class="panel-title">${title}</h3>${sub ? `<p class="mt-1 text-sm text-slate-400">${sub}</p>` : ''}</div>
        ${extra}
      </div>
      ${inner}
    </section>`;

  const STATUS = {
    open: ['Open', 'chip-cyan'],
    claimed: ['In progress', 'chip-slate'],
    pending: ['Pending review', 'chip-amber'],
    approved: ['Complete', 'chip-green']
  };
  const chip = s => `<span class="chip ${STATUS[s][1]}">${STATUS[s][0]}</span>`;
  const bar = pct => `<div class="bar"><span style="width:${pct}%"></span></div>`;

  /* ---------- Mission detail dialog ---------- */
  function missionEditForm(m) {
    const cats = [...new Set(state.missions.map(x => x.category).filter(Boolean))];
    return `
      <form data-form="editMission" data-id="${m.id}" class="space-y-3 p-5 sm:p-6">
        <div class="flex items-start justify-between gap-3">
          <h3 id="missionDialogTitle" class="font-display text-xl font-bold text-slate-100">Edit mission</h3>
          <button type="button" class="icon-btn shrink-0" data-act="closeDialog" aria-label="Close">✕</button>
        </div>
        ${m.status === 'approved' ? '<p class="rounded-lg border border-amber-500/40 bg-amber-500/10 p-3 text-sm text-amber-100">This mission is already complete. Changes will not alter Credits already paid, but repeats will use the new details.</p>' : ''}
        ${m.status === 'claimed' || m.status === 'pending' ? `<p class="rounded-lg border border-cyan-500/40 bg-cyan-500/10 p-3 text-sm text-cyan-100">${esc((getOp(m.assignee) || {}).name || 'An Operative')} is working on this. They will see your changes straight away.</p>` : ''}
        <label class="block"><span class="label">Title</span><input name="title" required maxlength="120" value="${esc(m.title)}" class="field mt-1 w-full"></label>
        <div class="grid grid-cols-2 gap-2">
          <label class="block"><span class="label">Credits</span><input name="credits" type="number" min="1" required value="${m.credits}" class="field mt-1 w-full"></label>
          <label class="block"><span class="label">Category</span><input name="category" maxlength="40" list="editCategoryList" value="${esc(m.category)}" class="field mt-1 w-full"></label>
        </div>
        <datalist id="editCategoryList">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
        <label class="block"><span class="label">Briefing</span><textarea name="details" rows="5" maxlength="1000" class="field mt-1 w-full">${esc(m.details)}</textarea></label>
        <label class="flex items-center gap-2 text-sm text-slate-300"><input type="checkbox" name="repeatable" ${m.repeatable ? 'checked' : ''} class="h-4 w-4 accent-cyan-500"> Auto-repeat after each approval</label>
        <div class="flex flex-wrap gap-2 pt-2">
          <button class="btn btn-cyan">Save changes</button>
          <button type="button" class="btn btn-ghost" data-act="details" data-id="${m.id}">Cancel</button>
        </div>
      </form>`;
  }

  function missionDetail(m) {
    const op = m.assignee ? getOp(m.assignee) : null;
    const isCmd = state.view === 'cmd';
    const line = (k, v) => v ? `<li class="flex justify-between gap-3 border-b border-slate-800 py-1.5 last:border-0"><span class="text-slate-400">${k}</span><span class="text-right text-slate-200">${v}</span></li>` : '';
    let btns = '';
    if (isCmd) {
      if (m.status === 'pending') btns += `<button class="btn btn-cyan" data-act="approveMission" data-id="${m.id}">Approve</button><button class="btn btn-red" data-act="rejectMission" data-id="${m.id}">Return</button>`;
      btns += `<button class="btn btn-cyan" data-act="editMission" data-id="${m.id}">Edit</button>`;
      btns += `<button class="btn btn-amber" data-act="repost" data-id="${m.id}">Repeat on board</button>`;
      btns += `<button class="btn btn-ghost" data-act="toggleRepeat" data-id="${m.id}">${m.repeatable ? 'Turn off auto-repeat' : 'Turn on auto-repeat'}</button>`;
    } else if (m.status === 'open') {
      btns = `<button class="btn btn-cyan" data-act="claim" data-op="${state.view}" data-id="${m.id}">Claim mission</button>`;
    } else if (m.status === 'claimed' && m.assignee === state.view) {
      btns = `<button class="btn btn-amber" data-act="submit" data-id="${m.id}">Mark complete</button><button class="btn btn-ghost" data-act="abandon" data-id="${m.id}">Release</button>`;
    }
    return `
      <div class="p-5 sm:p-6">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="mb-2 flex flex-wrap gap-2">${chip(m.status)}${m.category ? `<span class="chip chip-slate">${esc(m.category)}</span>` : ''}${m.repeatable ? '<span class="chip chip-cyan">Auto-repeat</span>' : ''}</div>
            <h3 id="missionDialogTitle" class="font-display text-xl font-bold text-slate-100">${esc(m.title)}</h3>
          </div>
          <button class="icon-btn shrink-0" data-act="closeDialog" aria-label="Close">✕</button>
        </div>
        <p class="mt-3 font-display text-2xl font-extrabold text-amber-400 glow-amber">${m.credits} CR <span class="text-sm font-semibold text-amber-300/70">${money(m.credits)}</span></p>
        <h4 class="subhead">Briefing</h4>
        <p class="whitespace-pre-line rounded-xl border border-slate-700/60 bg-slate-900/60 p-3 text-sm leading-relaxed text-slate-200">${m.details ? esc(m.details) : 'No briefing notes for this mission.'}</p>
        ${m.note && m.status === 'claimed' ? `<p class="mt-3 rounded-lg border border-rose-500/40 bg-rose-500/10 p-3 text-sm text-rose-100">Returned by the Commander: ${esc(m.note)}</p>` : ''}
        <h4 class="subhead">Mission log</h4>
        <ul class="text-sm">
          ${line('Posted', m.createdAt && fmtTs(m.createdAt))}
          ${line('Operative', op && esc(op.name))}
          ${line('Claimed', m.claimedAt && fmtTs(m.claimedAt))}
          ${line('Submitted', m.submittedAt && fmtTs(m.submittedAt))}
          ${line('Approved', m.approvedAt && fmtTs(m.approvedAt))}
        </ul>
        ${btns ? `<div class="mt-5 flex flex-wrap gap-2">${btns}</div>` : ''}
      </div>`;
  }
  function openMission(id, editing = false) {
    const m = getMission(id); if (!m) return;
    const dlg = document.getElementById('missionDialog');
    document.getElementById('missionDialogBody').innerHTML = editing ? missionEditForm(m) : missionDetail(m);
    if (!dlg.open) dlg.showModal();
  }
  const titleBtn = m => `<button class="text-left text-slate-100 underline decoration-cyan-500/40 decoration-dotted underline-offset-4 hover:text-cyan-200" data-act="details" data-id="${m.id}">${esc(m.title)}</button>`;
  const detailsBtn = m => `<button class="btn btn-ghost" data-act="details" data-id="${m.id}">Details</button>`;

  /* ---------- Header ---------- */
  function renderSwitcher() {
    const qn = getQueue().length;
    const btn = (id, title, sub, badge = '') => `
      <button class="switch-btn" data-act="view" data-id="${id}" aria-current="${state.view === id}">
        <span>
          <span class="block font-display text-xs font-semibold text-slate-100">${title}</span>
          <span class="block text-[11px] text-slate-400">${sub}</span>
        </span>${badge}
      </button>`;
    document.getElementById('switcher').innerHTML =
      btn('cmd', esc(state.commander.name), 'Admin console',
        qn ? `<span class="grid h-5 min-w-[1.25rem] place-items-center rounded-full bg-amber-500 px-1 text-[11px] font-bold text-slate-950">${qn}</span>` : '') +
      state.operatives.map(o => btn(o.id, esc(o.name), `<span class="text-amber-300">${o.credits} CR</span>`)).join('');
  }

  /* ---------- Commander view ---------- */
  function renderCommander() {
    const q = getQueue();
    const open = state.missions.filter(m => m.status === 'open').length;
    const issued = state.ledger.filter(l => l.amount > 0).reduce((a, l) => a + l.amount, 0);
    const weekAgo = Date.now() - 7 * 864e5;
    const doneWeek = state.missions.filter(m => m.status === 'approved' && (m.approvedAt || 0) >= weekAgo).length;
    const stat = (label, val, amber) => `
      <div class="panel p-4">
        <p class="label">${label}</p>
        <p class="mt-1 font-display text-3xl font-bold ${amber ? 'text-amber-400 glow-amber' : 'text-cyan-300 glow-text'}">${val}</p>
      </div>`;
    return `
      <section class="mb-6">
        <h2 class="font-display text-2xl font-bold text-slate-100 sm:text-3xl">Command deck</h2>
        <p class="mt-1 text-slate-400">Review completed work, post missions and manage the Credit Vault.</p>
      </section>
      <div class="mb-6 grid grid-cols-2 gap-3 lg:grid-cols-4">
        ${stat('Awaiting your review', q.length, true)}
        ${stat('Open missions', open)}
        ${stat('Credits issued to date', issued)}
        ${stat('Completed in the last 7 days', doneWeek, true)}
      </div>
      <div class="grid gap-6 lg:grid-cols-3">
        <div class="space-y-6 lg:col-span-2">${queuePanel(q)}${missionAdminPanel()}${libraryPanel()}</div>
        <div class="space-y-6">${squadPanel()}${vaultPanel()}${systemPanel()}</div>
      </div>`;
  }

  function queuePanel(q) {
    const items = q.length ? q.map(it => {
      const op = getOp(it.opId);
      const isM = it.kind === 'mission';
      const m = isM ? getMission(it.id) : null;
      const data = `data-id="${it.id}" data-op="${it.opId}" data-date="${it.date || ''}"`;
      return `
        <li class="row">
          <div class="min-w-0 flex-1">
            <div class="mb-1 flex flex-wrap items-center gap-2">
              <span class="chip ${isM ? 'chip-cyan' : 'chip-slate'}">${isM ? 'Mission' : 'Directive'}</span>
              ${m && m.repeatable ? '<span class="chip chip-cyan">Auto-repeat</span>' : ''}
              <span class="text-xs text-slate-400">${esc(op ? op.name : 'Unknown operative')}${isM ? '' : `, ${fmtDate(it.date)}`}</span>
            </div>
            ${m ? titleBtn(m) : `<p class="text-slate-100">${esc(it.title)}</p>`}
          </div>
          <span class="credit">+${it.credits} CR</span>
          <div class="flex flex-wrap gap-2">
            <button class="btn btn-cyan" data-act="${isM ? 'approveMission' : 'approveDir'}" ${data}>Approve</button>
            ${m && !m.repeatable ? `<button class="btn btn-amber" data-act="approveRepeat" ${data}>Approve and repeat</button>` : ''}
            <button class="btn btn-red" data-act="${isM ? 'rejectMission' : 'rejectDir'}" ${data}>Return</button>
          </div>
        </li>`;
    }).join('') : `<li class="empty">All clear. Nothing is waiting for review.</li>`;
    return panel('Approval dashboard', 'Credits transfer only after you approve. Tap a mission title to check the briefing.',
      `<ul class="space-y-2">${items}</ul>`,
      q.length > 1 ? `<button class="btn btn-amber" data-act="approveAll">Approve all ${q.length}</button>` : '');
  }

  function missionAdminPanel() {
    const order = { pending: 0, open: 1, claimed: 2, approved: 3 };
    const filters = { active: 'Active', open: 'Open', claimed: 'In progress', pending: 'Pending', approved: 'Complete', all: 'All' };
    let list = state.missions.slice();
    if (ui.missionFilter === 'active') list = list.filter(m => m.status !== 'approved');
    else if (ui.missionFilter !== 'all') list = list.filter(m => m.status === ui.missionFilter);
    list.sort((a, b) => (order[a.status] - order[b.status]) || ((b.approvedAt || b.createdAt) - (a.approvedAt || a.createdAt)));

    const tabs = Object.entries(filters).map(([k, v]) =>
      `<button class="btn ${ui.missionFilter === k ? 'btn-cyan' : 'btn-ghost'}" data-act="filter" data-id="${k}">${v}</button>`).join('');

    const rows = list.length ? list.map(m => {
      const op = m.assignee ? getOp(m.assignee) : null;
      return `
        <li class="row">
          <div class="min-w-0 flex-1">
            <div class="mb-1 flex flex-wrap items-center gap-2">${chip(m.status)}${m.category ? `<span class="chip chip-slate">${esc(m.category)}</span>` : ''}${op ? `<span class="text-xs text-slate-400">${esc(op.name)}</span>` : ''}</div>
            ${titleBtn(m)}
            ${m.details ? `<p class="mt-1 line-clamp-2 text-sm text-slate-400">${esc(m.details)}</p>` : ''}
          </div>
          <span class="credit">${m.credits} CR</span>
          <div class="flex flex-wrap gap-2">
            <button class="btn ${m.repeatable ? 'btn-cyan' : 'btn-ghost'}" data-act="toggleRepeat" data-id="${m.id}" aria-pressed="${m.repeatable}" title="Automatically put a fresh copy on the board each time this is approved">↻ ${m.repeatable ? 'Auto-repeat on' : 'Auto-repeat'}</button>
            <button class="btn btn-ghost" data-act="editMission" data-id="${m.id}">Edit</button>
            ${m.status === 'approved' ? `<button class="btn btn-amber" data-act="repost" data-id="${m.id}">Repeat</button>` : ''}
            <button class="icon-btn" data-act="deleteMission" data-id="${m.id}" aria-label="Delete mission" title="Delete mission">✕</button>
          </div>
        </li>`;
    }).join('') : `<li class="empty">No missions in this view. Post one above to fill the board.</li>`;

    return panel('Open mission board', 'Optional extra work Operatives can claim for Credits.', `
      <form data-form="addMission" class="mb-4 grid gap-2 sm:grid-cols-[1fr_6rem_auto]">
        <input name="title" required maxlength="120" placeholder="Mission title" class="field" aria-label="Mission title">
        <input name="credits" type="number" min="1" value="10" required class="field" aria-label="Credit value">
        <button class="btn btn-amber">Post mission</button>
        <textarea name="details" rows="2" maxlength="1000" placeholder="Briefing notes (optional)" class="field sm:col-span-3" aria-label="Briefing notes"></textarea>
        <input name="category" maxlength="40" list="categoryList" placeholder="Category (optional)" class="field sm:col-span-2" aria-label="Category">
        <label class="flex items-center gap-2 text-sm text-slate-300"><input type="checkbox" name="repeatable" class="h-4 w-4 accent-cyan-500"> Auto-repeat</label>
        <datalist id="categoryList">${[...new Set(state.missions.map(m => m.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      </form>
      <div class="mb-3 flex flex-wrap gap-2">${tabs}</div>
      <ul class="space-y-2">${rows}</ul>`);
  }

  function libraryPanel() {
    const map = new Map();
    state.missions.filter(m => m.status === 'approved')
      .sort((a, b) => (b.approvedAt || 0) - (a.approvedAt || 0))
      .forEach(m => {
        const k = m.title.trim().toLowerCase();
        if (!map.has(k)) map.set(k, { m, count: 0 });
        map.get(k).count++;
      });
    const items = [...map.values()].sort((a, b) => a.m.title.localeCompare(b.m.title));
    const rows = items.map(({ m, count }) => {
      const onBoard = openCopyExists(m);
      return `
        <li class="row" data-lib="${esc(m.title.toLowerCase())} ${esc((m.category || '').toLowerCase())}">
          <div class="min-w-0 flex-1">
            ${titleBtn(m)}
            <p class="mt-1 text-xs text-slate-400">${m.category ? esc(m.category) + ', ' : ''}completed ${count} time${count === 1 ? '' : 's'}, last on ${fmtTs(m.approvedAt || m.createdAt)}</p>
          </div>
          <span class="credit">${m.credits} CR</span>
          ${onBoard ? '<span class="chip chip-cyan">On the board</span>' : `<button class="btn btn-amber" data-act="repost" data-id="${m.id}">Add to board</button>`}
        </li>`;
    }).join('') || '<li class="empty">Completed missions appear here, ready to put back on the board.</li>';
    return panel('Repeat a past mission', 'Every completed mission, ready to go back on the board with one tap.', `
      ${items.length > 5 ? '<input id="libFilter" type="search" placeholder="Filter by name or category" class="field mb-3 w-full" aria-label="Filter past missions">' : ''}
      <ul id="libList" class="max-h-96 space-y-2 overflow-y-auto pr-1">${rows}</ul>`);
  }



  function squadPanel() {
    const cards = state.operatives.map(o => {
      const pct = goalPct(o);
      const active = state.missions.filter(m => m.assignee === o.id && (m.status === 'claimed' || m.status === 'pending')).length;
      return `
        <div class="rounded-xl border border-slate-700/60 bg-slate-900/50 p-3">
          <div class="flex items-center gap-3">
            <div class="h-16 w-16 shrink-0 overflow-hidden rounded-lg border border-cyan-500/20 bg-slate-950/60">${avatarSVG(o.goal.avatar, pct, { sfx: 'm' + o.id, cls: 'h-full w-full' })}</div>
            <div class="min-w-0 flex-1">
              <div class="flex items-baseline justify-between gap-2"><p class="truncate font-display text-sm font-semibold text-slate-100">${esc(o.name)}</p><p class="credit">${o.credits} CR${money(o.credits) ? ` <span class="text-xs font-semibold text-amber-300/70">${money(o.credits)}</span>` : ''}</p></div>
              <p class="mb-1.5 text-xs text-slate-400">${esc(o.callsign)}, ${active} active mission${active === 1 ? '' : 's'}</p>
              ${bar(pct)}
              <p class="mt-1 text-xs text-slate-400">${esc(o.goal.name)}: ${pct}% of ${o.goal.target} CR</p>
            </div>
          </div>
          <div class="mt-3 flex items-center justify-end gap-2">
            <div class="flex gap-2">
              ${pct >= 100 ? `<button class="btn btn-amber" data-act="redeem" data-op="${o.id}">Redeem goal</button>` : ''}
              <button class="btn btn-ghost" data-act="view" data-id="${o.id}">Open</button>
            </div>
          </div>
        </div>`;
    }).join('');
    return panel('Squad overview', 'Balances and goal progress for each Operative.', `<div class="space-y-3">${cards}</div>`);
  }

  function vaultPanel() {
    const rows = state.ledger.slice(0, 40).map(l => {
      const op = getOp(l.opId);
      return `
        <li class="flex items-start justify-between gap-3 border-b border-slate-800 py-2 text-sm last:border-0">
          <div class="min-w-0"><p class="truncate text-slate-200">${esc(l.reason)}</p><p class="text-xs text-slate-500">${esc(op ? op.name : 'Unknown')}, ${fmtTs(l.ts)}</p></div>
          <span class="shrink-0 font-display font-bold ${l.amount >= 0 ? 'text-amber-400' : 'text-rose-300'}">${l.amount >= 0 ? '+' : ''}${l.amount}</span>
        </li>`;
    }).join('') || `<li class="empty">No transactions yet. Approved work appears here.</li>`;
    return panel('Credit vault', 'Grant bonuses or make corrections.', `
      <form data-form="adjust" class="mb-4 grid grid-cols-2 gap-2">
        <select name="op" class="field col-span-2" aria-label="Operative">${state.operatives.map(o => `<option value="${o.id}">${esc(o.name)} (${o.credits} CR)</option>`).join('')}</select>
        <input name="amount" type="number" min="1" required placeholder="Amount" class="field" aria-label="Amount">
        <input name="reason" maxlength="80" placeholder="Reason" class="field" aria-label="Reason">
        <button name="mode" value="grant" class="btn btn-cyan">Grant</button>
        <button name="mode" value="deduct" class="btn btn-red">Deduct</button>
      </form>
      <ul class="max-h-80 overflow-y-auto pr-1">${rows}</ul>`);
  }

  function systemPanel() {
    return panel('System', 'Names, settings, backups and reset.', `
      <form data-form="rename" class="space-y-2">
        <label class="block"><span class="label">Commander display name</span><input name="cmd" value="${esc(state.commander.name)}" maxlength="40" class="field mt-1 w-full"></label>
        ${state.operatives.map(o => `
          <div class="grid grid-cols-[1fr_7rem] gap-2">
            <input name="name-${o.id}" value="${esc(o.name)}" maxlength="40" class="field" aria-label="Operative name">
            <input name="cs-${o.id}" value="${esc(o.callsign)}" maxlength="14" class="field" aria-label="Callsign">
          </div>`).join('')}
        <label class="block"><span class="label">Team name</span><input name="team" value="${esc(state.settings.teamName)}" maxlength="40" class="field mt-1 w-full"></label>
        <div class="grid grid-cols-2 gap-2">
          <label class="block"><span class="label">Currency symbol</span><input name="currency" value="${esc(state.settings.currency)}" maxlength="3" placeholder="e.g. $" class="field mt-1 w-full"></label>
          <label class="block"><span class="label">Credits per 1 unit</span><input name="ppu" type="number" min="0" value="${state.settings.pointsPerUnit || ''}" placeholder="e.g. 100" class="field mt-1 w-full"></label>
        </div>
        <button class="btn btn-cyan w-full">Save settings</button>
      </form>
      ${state.operatives.length < 6 ? '<button class="btn btn-ghost mt-2 w-full" data-act="addOperative">Add an operative</button>' : ''}
      <div class="mt-4 grid grid-cols-3 gap-2">
        <button class="btn btn-ghost" data-act="export">Export</button>
        <button class="btn btn-ghost" data-act="import">Import</button>
        <button class="btn btn-red" data-act="reset">Reset</button>
      </div>
      <button class="btn btn-amber mt-2 w-full" data-act="importWeb">Import from website</button>
      <p class="mt-1 text-xs text-slate-500">Loads a backup file uploaded next to index.html on GitHub. Delete it from GitHub afterwards.</p>`);
  }

  /* ---------- Operative view ---------- */
  function renderOperative(op) {
    const activeN = state.missions.filter(m => m.assignee === op.id && m.status === 'claimed').length;
    const doneN = state.missions.filter(m => m.assignee === op.id && m.status === 'approved').length;
    const pendingCr = getQueue().filter(i => i.opId === op.id).reduce((a, i) => a + i.credits, 0);
    return `
      <section class="panel mb-6 flex flex-wrap items-center justify-between gap-4 p-5">
        <div>
          <p class="label">Operative console, ${esc(op.callsign)}</p>
          <h2 class="mt-1 font-display text-2xl font-bold text-slate-100 sm:text-3xl">${esc(op.name)}</h2>
          <p class="mt-1 text-sm text-slate-400"><span class="font-semibold text-amber-300">${doneN}</span> mission${doneN === 1 ? '' : 's'} completed, ${activeN} in progress</p>
        </div>
        <div class="text-right">
          <p class="label">Credit vault balance</p>
          <p class="font-display text-4xl font-extrabold text-amber-400 glow-amber">${op.credits}<span class="ml-1 text-base text-amber-300/70">CR</span></p>
          ${money(op.credits) ? `<p class="text-sm text-amber-200/80">Worth ${money(op.credits)}</p>` : ''}
          <p class="text-xs text-slate-400">${pendingCr ? `${pendingCr} CR awaiting verification` : 'Nothing awaiting verification'}</p>
        </div>
      </section>
      <div class="grid gap-6 lg:grid-cols-5">
        <div class="space-y-6 lg:col-span-3">${opMissionsPanel(op)}</div>
        <div class="space-y-6 lg:col-span-2">${blueprintPanel(op)}${opLedgerPanel(op)}</div>
      </div>`;
  }


  function opMissionsPanel(op) {
    const avail = state.missions.filter(m => m.status === 'open');
    const mine = state.missions.filter(m => m.assignee === op.id && m.status === 'claimed');
    const pend = state.missions.filter(m => m.assignee === op.id && m.status === 'pending');
    const done = state.missions.filter(m => m.assignee === op.id && m.status === 'approved')
      .sort((a, b) => (b.approvedAt || 0) - (a.approvedAt || 0)).slice(0, 5);

    const row = (m, actions) => `
      <li class="row">
        <div class="min-w-0 flex-1">
          ${m.category ? `<span class="chip chip-slate mb-1">${esc(m.category)}</span>` : ''}
          <div>${titleBtn(m)}</div>
          ${m.details ? `<p class="mt-1 line-clamp-2 text-sm text-slate-400">${esc(m.details)}</p>` : ''}
          ${m.note && m.status === 'claimed' ? `<p class="mt-1 text-sm text-rose-200">Returned: ${esc(m.note)}</p>` : ''}
        </div>
        <span class="credit">${m.credits} CR</span>
        <div class="flex flex-wrap gap-2">${detailsBtn(m)}${actions}</div>
      </li>`;

    return panel('Mission board', 'Claim extra missions to earn Credits. Open any mission to read its full briefing.', `
      <h4 class="subhead">Your active missions</h4>
      <ul class="space-y-2">${mine.map(m => row(m, `<button class="btn btn-amber" data-act="submit" data-id="${m.id}">Mark complete</button><button class="btn btn-ghost" data-act="abandon" data-id="${m.id}">Release</button>`)).join('') || '<li class="empty">No active missions. Claim one below.</li>'}</ul>
      ${pend.length ? `<h4 class="subhead">Pending review</h4><ul class="space-y-2">${pend.map(m => row(m, chip('pending'))).join('')}</ul>` : ''}
      <h4 class="subhead">Available</h4>
      <ul class="space-y-2">${avail.map(m => row(m, `<button class="btn btn-cyan" data-act="claim" data-op="${op.id}" data-id="${m.id}">Claim</button>`)).join('') || '<li class="empty">The board is empty. Check back after the Commander posts new missions.</li>'}</ul>
      ${done.length ? `<h4 class="subhead">Recently completed</h4><ul class="space-y-2">${done.map(m => row(m, chip('approved'))).join('')}</ul>` : ''}`);
  }

  function blueprintPanel(op) {
    const g = op.goal; const av = AVATARS[g.avatar];
    const pct = goalPct(op);
    const unlocked = unlockedCount(pct);
    const newPart = (op.lastUnlocked != null && unlocked > op.lastUnlocked) ? unlocked - 1 : -1;
    const stageIdx = pct >= 100 ? 4 : Math.floor(pct / 25);
    const thresholds = [.25, .5, .75, 1].map(f => Math.ceil(g.target * f));
    const nextT = thresholds.find(t => op.credits < t);
    const milestones = av.stages.slice(0, 4).map((name, i) => `
      <li class="flex items-center gap-2 text-sm ${i < unlocked ? 'text-slate-100' : 'text-slate-500'}">
        <span class="h-2 w-2 rounded-full ${i < unlocked ? 'bg-cyan-400 shadow-[0_0_6px_#06b6d4]' : 'bg-slate-700'}"></span>
        ${name}<span class="ml-auto text-xs">${i * 25}%</span>
      </li>`).join('');
    const options = Object.entries(AVATARS).map(([k, a]) => `
      <label class="block cursor-pointer">
        <input type="radio" name="avatar" value="${k}" ${g.avatar === k ? 'checked' : ''} class="peer sr-only">
        <span class="block rounded-xl border border-slate-700 p-2 text-center transition peer-checked:border-cyan-400 peer-checked:bg-cyan-500/10 peer-focus-visible:ring-2 peer-focus-visible:ring-amber-400">
          <span class="mx-auto block h-20 w-20">${avatarSVG(k, 99, { sfx: 'p' + k + op.id, cls: 'h-full w-full' })}</span>
          <span class="block text-xs text-slate-200">${a.label}</span>
        </span>
      </label>`).join('');

    return panel('Blueprint assembly bay', 'Your savings goal builds a companion as Credits come in.', `
      <div class="relative overflow-hidden rounded-xl border border-cyan-500/30 bg-[#0b0f19]/80">
        ${avatarSVG(g.avatar, pct, { sfx: 'b' + op.id, newPart, cls: 'mx-auto block h-64 w-full max-w-xs' })}
        <div class="absolute left-3 top-3 rounded-md bg-slate-900/80 px-2 py-1 font-display text-xs text-cyan-200">${pct}%</div>
      </div>
      <div class="mt-4">
        <div class="mb-1 flex items-baseline justify-between gap-2">
          <p class="font-display font-semibold text-slate-100">${esc(g.name)}</p>
          <p class="text-sm text-slate-400"><span class="text-amber-400">${Math.min(op.credits, g.target)}</span> / ${g.target} CR</p>
        </div>
        ${bar(pct)}
        <p class="mt-2 text-sm ${pct >= 100 ? 'text-amber-300' : 'text-slate-400'}">
          ${pct >= 100 ? 'Assembly complete. Ask the Commander to redeem your goal.'
            : `Stage: ${av.stages[stageIdx]}. ${nextT - op.credits} CR until the next part.`}
        </p>
      </div>
      <ul class="mt-4 space-y-1.5">${milestones}</ul>
      <details class="mt-4 rounded-xl border border-slate-700/60 bg-slate-900/40">
        <summary class="cursor-pointer px-4 py-3 font-display text-sm text-cyan-200">Configure blueprint</summary>
        <form data-form="goal" data-op="${op.id}" class="space-y-3 px-4 pb-4">
          <div class="grid grid-cols-2 gap-2">${options}</div>
          <label class="block"><span class="label">Companion name</span><input name="name" value="${esc(g.name)}" maxlength="40" class="field mt-1 w-full"></label>
          <label class="block"><span class="label">Target cost (Credits)</span><input name="target" type="number" min="1" value="${g.target}" required class="field mt-1 w-full"></label>
          <button class="btn btn-cyan w-full">Save blueprint</button>
        </form>
      </details>`);
  }

  function opLedgerPanel(op) {
    const rows = state.ledger.filter(l => l.opId === op.id).slice(0, 15).map(l => `
      <li class="flex items-start justify-between gap-3 border-b border-slate-800 py-2 text-sm last:border-0">
        <div class="min-w-0"><p class="truncate text-slate-200">${esc(l.reason)}</p><p class="text-xs text-slate-500">${fmtTs(l.ts)}</p></div>
        <span class="shrink-0 font-display font-bold ${l.amount >= 0 ? 'text-amber-400' : 'text-rose-300'}">${l.amount >= 0 ? '+' : ''}${l.amount}</span>
      </li>`).join('') || `<li class="empty">No Credits yet. Claim and complete missions to start earning.</li>`;
    return panel('Your vault history', '', `<ul>${rows}</ul>`);
  }

  /* ---------- Render ---------- */
  function render() {
    renderSwitcher();
    document.getElementById('teamName').textContent = state.settings.teamName || 'Task and Credit Tracker';
    const app = document.getElementById('app');
    const op = state.view !== 'cmd' ? getOp(state.view) : null;
    app.innerHTML = op ? renderOperative(op) : renderCommander();

    if (op) {
      const pct = goalPct(op);
      let dirty = false;
      const unlocked = unlockedCount(pct);
      if (op.lastUnlocked !== unlocked) { op.lastUnlocked = unlocked; dirty = true; }
      if (pct >= 100 && !op.celebrated) {
        op.celebrated = true; dirty = true;
        confetti(); toast(`${op.goal.name} is fully assembled!`, 'gold');
      } else if (pct < 100 && op.celebrated) { op.celebrated = false; dirty = true; }
      if (dirty) save();
    }
  }

  function commit() { save(); render(); }

  /* ---------- Actions ---------- */
  function approveMission(id) {
    const m = getMission(id); if (!m || m.status !== 'pending') return;
    const op = getOp(m.assignee);
    m.status = 'approved'; m.approvedAt = Date.now(); m.note = '';
    if (op) credit(op, m.credits, `Mission: ${m.title}`);
    if (m.repeatable && !openCopyExists(m)) { repeatMission(m); return true; }
    return false;
  }
  const actions = {
    view: el => { state.view = el.dataset.id; commit(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
    filter: el => { ui.missionFilter = el.dataset.id; render(); },
    details: el => openMission(el.dataset.id),
    editMission: el => openMission(el.dataset.id, true),
    closeDialog: () => document.getElementById('missionDialog').close(),

    claim: el => {
      const m = getMission(el.dataset.id);
      if (!m || m.status !== 'open') { toast('That mission is no longer available.', 'warn'); render(); return; }
      m.status = 'claimed'; m.assignee = el.dataset.op; m.note = ''; m.claimedAt = Date.now();
      toast(`Mission claimed: ${m.title}`); commit();
    },
    submit: el => {
      const m = getMission(el.dataset.id); if (!m) return;
      m.status = 'pending'; m.submittedAt = Date.now();
      toast('Marked complete. Sent to the Commander for review.'); commit();
    },
    abandon: el => {
      const m = getMission(el.dataset.id); if (!m) return;
      m.status = 'open'; m.assignee = null; m.note = ''; delete m.claimedAt;
      toast('Mission released back to the board.'); commit();
    },

    approveMission: el => {
      const again = approveMission(el.dataset.id);
      toast(again ? 'Mission approved. Credits transferred and a fresh copy is back on the board.' : 'Mission approved. Credits transferred.', 'gold'); commit();
    },
    approveRepeat: el => {
      const m = getMission(el.dataset.id); if (!m) return;
      approveMission(m.id);
      if (!openCopyExists(m)) repeatMission(m);
      toast('Mission approved and put back on the board.', 'gold'); commit();
    },
    toggleRepeat: el => {
      const m = getMission(el.dataset.id); if (!m) return;
      m.repeatable = !m.repeatable;
      state.missions.filter(x => sameTitle(x.title, m.title)).forEach(x => { x.repeatable = m.repeatable; });
      toast(m.repeatable ? `Auto-repeat on. "${m.title}" returns to the board each time it is approved.` : `Auto-repeat off for "${m.title}".`);
      commit();
    },
    addOperative: () => {
      const n = state.operatives.length;
      state.operatives.push({ id: 'op' + uid(), name: `Operative ${n + 1}`, callsign: CALLSIGNS[n] || `OP-${n + 1}`, credits: 0, directives: [], log: {}, goal: { avatar: 'droid', name: 'Utility Droid', target: 150 }, celebrated: false, lastUnlocked: null });
      toast('Operative added. Rename them in the System panel.'); commit();
    },
    rejectMission: el => {
      const m = getMission(el.dataset.id); if (!m) return;
      const note = prompt('Reason for returning this mission (optional):', '');
      if (note === null) return;
      m.status = 'claimed'; m.note = note.trim() || 'Needs more work.';
      toast('Mission returned to the Operative.'); commit();
    },
    approveAll: () => {
      const q = getQueue();
      q.forEach(it => approveMission(it.id));
      toast(`Approved ${q.length} items.`, 'gold'); commit();
    },

    deleteMission: el => {
      const m = getMission(el.dataset.id); if (!m) return;
      if (!confirm(`Delete mission "${m.title}"? Credits already awarded stay in the vault.`)) return;
      state.missions = state.missions.filter(x => x.id !== m.id);
      toast('Mission deleted.'); commit();
    },
    repost: el => {
      const m = getMission(el.dataset.id); if (!m) return;
      if (openCopyExists(m) && !confirm(`"${m.title}" is already open on the board. Add another copy?`)) return;
      repeatMission(m);
      toast(`"${m.title}" is back on the mission board.`); commit();
    },
    redeem: el => {
      const op = getOp(el.dataset.op); const t = op.goal.target;
      if (op.credits < t) { toast('Not enough Credits to redeem yet.', 'warn'); return; }
      if (!confirm(`Redeem ${t} CR from ${op.name} for "${op.goal.name}"?`)) return;
      credit(op, -t, `Goal redeemed: ${op.goal.name}`);
      op.celebrated = false; op.lastUnlocked = null;
      toast(`${op.goal.name} redeemed for ${op.name}.`, 'gold'); commit();
    },

    export: () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `galactic-ops-backup-${todayKey()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('Backup exported.');
    },
    import: () => document.getElementById('importFile').click(),
    importWeb: async () => {
      const name = prompt('Backup file name on the website:', 'backup.json');
      if (!name) return;
      try {
        const res = await fetch(name.trim(), { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        importText(await res.text());
      } catch (err) {
        toast(`Could not load "${name}". Check it is uploaded next to index.html and the name matches exactly.`, 'warn');
      }
    },
    reset: () => {
      if (!confirm('Reset all data? This erases missions, Credits and settings in this browser.')) return;
      state = defaultState(); ui.missionFilter = 'active';
      toast('System reset to defaults.'); commit();
    }
  };

  const forms = {
    addMission: (f, fd) => {
      const title = fd.get('title').trim(); if (!title) return;
      state.missions.push({ id: uid(), title, details: (fd.get('details') || '').trim(), category: (fd.get('category') || '').trim(), repeatable: fd.get('repeatable') === 'on', credits: toInt(fd.get('credits'), 1, 10), status: 'open', assignee: null, createdAt: Date.now() });
      toast('Mission posted to the board.');
    },
    editMission: (f, fd) => {
      const m = getMission(f.dataset.id); if (!m) return;
      const title = (fd.get('title') || '').trim(); if (!title) return;
      m.title = title;
      m.credits = toInt(fd.get('credits'), 1, m.credits);
      m.category = (fd.get('category') || '').trim();
      m.details = (fd.get('details') || '').trim();
      m.repeatable = fd.get('repeatable') === 'on';
      toast('Mission updated.');
    },
    adjust: (f, fd, submitter) => {
      const op = getOp(fd.get('op')); const amt = toInt(fd.get('amount'), 1, 0); if (!op || !amt) return;
      const deduct = submitter && submitter.value === 'deduct';
      const reason = (fd.get('reason') || '').trim() || (deduct ? 'Commander deduction' : 'Commander bonus');
      credit(op, deduct ? -amt : amt, reason);
      toast(`${deduct ? 'Deducted' : 'Granted'} ${amt} CR ${deduct ? 'from' : 'to'} ${op.name}.`, 'gold');
    },
    goal: (f, fd) => {
      const op = getOp(f.dataset.op);
      const avatar = AVATARS[fd.get('avatar')] ? fd.get('avatar') : op.goal.avatar;
      let name = (fd.get('name') || '').trim();
      const wasDefault = Object.values(AVATARS).some(a => a.label === op.goal.name);
      if (!name || (wasDefault && name === op.goal.name && avatar !== op.goal.avatar)) name = AVATARS[avatar].label;
      op.goal = { avatar, name, target: toInt(fd.get('target'), 1, op.goal.target) };
      op.lastUnlocked = null;
      toast('Blueprint saved.');
    },
    rename: (f, fd) => {
      state.commander.name = (fd.get('cmd') || '').trim() || 'Commander';
      state.operatives.forEach(o => {
        o.name = (fd.get('name-' + o.id) || '').trim() || o.name;
        o.callsign = (fd.get('cs-' + o.id) || '').trim().toUpperCase() || o.callsign;
      });
      state.settings.teamName = (fd.get('team') || '').trim() || 'Task and Credit Tracker';
      state.settings.currency = (fd.get('currency') || '').trim();
      state.settings.pointsPerUnit = toInt(fd.get('ppu'), 0, 0);
      toast('Settings saved.');
    }
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || !actions[el.dataset.act]) return;
    e.preventDefault();
    const dlg = document.getElementById('missionDialog');
    if (dlg.open && dlg.contains(el) && !['details', 'editMission'].includes(el.dataset.act)) dlg.close();
    actions[el.dataset.act](el);
  });

  document.getElementById('missionDialog').addEventListener('click', e => {
    if (e.target.id === 'missionDialog') e.target.close();
  });

  document.addEventListener('input', e => {
    if (e.target.id !== 'libFilter') return;
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('#libList [data-lib]').forEach(li => { li.hidden = q && !li.dataset.lib.includes(q); });
  });

  document.addEventListener('submit', e => {
    const f = e.target.closest('form[data-form]'); if (!f) return;
    e.preventDefault();
    const handler = forms[f.dataset.form]; if (!handler) return;
    handler(f, new FormData(f), e.submitter);
    commit();
    if (f.dataset.form === 'editMission') openMission(f.dataset.id);
  });

  function importText(text) {
    let data;
    try { data = JSON.parse(text); } catch (err) { toast('Import failed: this file is not a recognised tracker backup.', 'warn'); return; }
    let next, summary;
    if (isLegacy(data)) {
      next = convertLegacy(data);
      summary = 'Backup from the previous tracker detected. It will be converted as follows:\n\n';
    } else if (data && Array.isArray(data.operatives)) {
      next = migrate(data);
      summary = 'Restore this backup?\n\n';
    } else { toast('Import failed: this file is not a recognised tracker backup.', 'warn'); return; }
    summary += next.operatives.map(o => `${o.name}: ${o.credits} CR, goal ${o.goal.target} CR`).join('\n');
    summary += `\n${next.missions.length} missions, ${next.ledger.length} vault entries.\n\nThis replaces the data currently in this browser. Continue?`;
    if (!confirm(summary)) return;
    state = next; commit(); toast('Backup imported. All balances restored.', 'gold');
  }

  document.getElementById('importFile').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { importText(reader.result); e.target.value = ''; };
    reader.readAsText(file);
  });

  /* ---------- Clock and day rollover ---------- */
  let lastDay = todayKey();
  function tick() {
    const d = new Date();
    const start = new Date(d.getFullYear(), 0, 0);
    const doy = Math.floor((d - start) / 864e5);
    document.getElementById('stardate').textContent =
      `Stardate ${d.getFullYear()}.${String(doy).padStart(3, '0')}, ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
    if (todayKey() !== lastDay) { lastDay = todayKey(); render(); }
  }

  render();
  tick();
  setInterval(tick, 30000);
})();
</script>
</body>
</html>
