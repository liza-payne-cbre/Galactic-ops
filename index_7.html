<body>

<header class="topbar">
  <div class="brand">
    <svg class="sigil" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="19" fill="none" stroke="#38bdf8" stroke-width="2" opacity=".5"/>
      <circle cx="22" cy="22" r="13" fill="none" stroke="#38bdf8" stroke-width="2.4"/>
      <path d="M22 3v6M22 35v6M3 22h6M35 22h6" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="22" cy="22" r="4.5" fill="#fbbf24"/>
    </svg>
    <div>
      <h1>Galactic Ops Terminal<span class="rev">Rev 2</span></h1>
      <p class="date" id="todayLabel"></p>
    </div>
  </div>
  <div class="who" id="userSwitch" role="group" aria-label="Signed in as"></div>
</header>

<section class="profile" id="profile" aria-live="polite"></section>

<div class="tabs-wrap">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
</div>

<main id="view"></main>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" class="sr-only" tabindex="-1" aria-hidden="true">

<script>
(function () {
  'use strict';

  /* =========================================================
     Configuration
     ========================================================= */
  var STORE_KEY = 'team-task-tracker.v2';   // same key as Rev 1, so existing data carries over
  var UI_KEY = 'team-task-tracker.ui.v1';
  var DEFAULT_CREDITS_PER_UNIT = 100;      // 100 credits = 1.00 currency unit
  var DEFAULT_CURRENCY = '$';
  var MAX_OPERATIVES = 4;

  /* ---------- Storage with in-memory fallback ---------- */
  var memoryStore = {};
  function readKey(k) {
    try { var raw = localStorage.getItem(k); return raw ? JSON.parse(raw) : null; }
    catch (e) { return memoryStore[k] ? JSON.parse(memoryStore[k]) : null; }
  }
  function writeKey(k, v) {
    var s = JSON.stringify(v);
    try { localStorage.setItem(k, s); } catch (e) { memoryStore[k] = s; }
  }
  function save() { writeKey(STORE_KEY, state); }
  function saveUI() { writeKey(UI_KEY, { user: ui.user, tab: ui.tab }); }

  /* ---------- Helpers ---------- */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function dateKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function daysAgo(n, hour) { var d = new Date(); d.setDate(d.getDate() - n); d.setHours(hour || 10, 0, 0, 0); return d; }
  function nowISO() { return new Date().toISOString(); }
  function fmtDay(d) { return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); }
  function fmtDate(iso) { return fmtDay(new Date(iso)); }
  function fmtDateTime(iso) {
    var d = new Date(iso);
    return fmtDay(d) + ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }
  function initials(name) {
    return String(name || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
  }
  function num(n) { return Number(n || 0).toLocaleString(); }
  function money(credits) {
    var s = state.settings;
    return s.currency + ((credits || 0) / (s.pointsPerUnit || 1)).toFixed(2);
  }

  /* =========================================================
     Blueprints
     Each part has a stage (1 to 4) and is listed in drawing order.
     The full set is drawn as a dashed outline; parts light up as
     the operative's vault reaches 25, 50, 75 and 100 percent.
     ========================================================= */
  var BLUEPRINTS = {
    droid: {
      label: 'Utility droid',
      stages: ['Drive treads and base', 'Main chassis', 'Arms and scanner', 'Head and sensor visor'],
      parts: [
        // Stage 1: treads and base
        { s: 1, svg: '<rect class="f-dark" x="50" y="170" width="60" height="40" rx="20"/><rect class="f-dark" x="130" y="170" width="60" height="40" rx="20"/>' +
          '<circle class="f-mid" cx="68" cy="190" r="10"/><circle class="f-mid" cx="92" cy="190" r="10"/><circle class="f-mid" cx="148" cy="190" r="10"/><circle class="f-mid" cx="172" cy="190" r="10"/>' +
          '<rect class="f-mid" x="104" y="182" width="32" height="12" rx="4"/>' },
        // Stage 3 (drawn behind the body): shoulders
        { s: 3, svg: '<circle class="f-mid" cx="66" cy="120" r="12"/><circle class="f-mid" cx="174" cy="120" r="12"/>' },
        // Stage 2: chassis
        { s: 2, svg: '<rect class="f-light" x="68" y="102" width="104" height="74" rx="14"/>' +
          '<rect class="f-panel" x="82" y="116" width="76" height="42" rx="7"/>' +
          '<circle class="f-amber" cx="120" cy="137" r="10" filter="url(#FID)"/>' +
          '<rect class="f-mid" x="84" y="164" width="18" height="6" rx="3"/><rect class="f-mid" x="111" y="164" width="18" height="6" rx="3"/><rect class="f-mid" x="138" y="164" width="18" height="6" rx="3"/>' },
        // Stage 3: arms, claw and scanner
        { s: 3, svg: '<rect class="f-light" x="30" y="112" width="34" height="14" rx="7"/><rect class="f-light" x="28" y="112" width="14" height="46" rx="7"/>' +
          '<path class="f-mid" d="M26 156 h18 l-3 16 h-4 l-2 -9 l-2 9 h-4 z"/>' +
          '<rect class="f-light" x="176" y="112" width="34" height="14" rx="7"/><rect class="f-light" x="198" y="112" width="14" height="40" rx="7"/>' +
          '<rect class="f-dark" x="190" y="148" width="30" height="22" rx="4"/><rect class="f-visor" x="195" y="153" width="20" height="12" rx="2" filter="url(#FID)"/>' },
        // Stage 4: neck, head, visor and antenna
        { s: 4, svg: '<rect class="f-mid" x="110" y="86" width="20" height="20" rx="3"/>' +
          '<rect class="f-light" x="80" y="46" width="80" height="44" rx="10"/>' +
          '<rect class="f-dark" x="90" y="57" width="60" height="20" rx="10"/>' +
          '<rect class="f-visor" x="95" y="62" width="50" height="10" rx="5" filter="url(#FID)"/>' +
          '<circle class="f-white" cx="110" cy="67" r="3"/>' +
          '<path class="ln s-mid" d="M146 46 L156 26"/><circle class="f-amber" cx="157" cy="24" r="6" filter="url(#FID)"/>' }
      ]
    },
    axolotl: {
      label: 'Axolotl',
      stages: ['Body core', 'Tail and fins', 'Legs and feet', 'Gill feathers and smile'],
      parts: [
        // Stage 2 (behind body): tail and fin
        { s: 2, svg: '<path class="f-pinkdark" d="M134 186 C 176 214, 222 196, 220 146 C 204 176, 168 184, 146 168 Z"/>' +
          '<path class="ln s-pink" d="M156 190 C 184 198, 206 186, 212 164"/>' +
          '<path class="f-pink" d="M120 116 C 112 106, 128 104, 124 116 Z"/>' },
        // Stage 4 (behind head): gill feathers
        { s: 4, svg: '<ellipse class="f-gill" cx="60" cy="62" rx="8" ry="22" transform="rotate(-38 60 62)"/>' +
          '<ellipse class="f-gill" cx="50" cy="90" rx="8" ry="22" transform="rotate(-80 50 90)"/>' +
          '<ellipse class="f-gill" cx="58" cy="118" rx="8" ry="22" transform="rotate(-122 58 118)"/>' +
          '<ellipse class="f-gill" cx="180" cy="62" rx="8" ry="22" transform="rotate(38 180 62)"/>' +
          '<ellipse class="f-gill" cx="190" cy="90" rx="8" ry="22" transform="rotate(80 190 90)"/>' +
          '<ellipse class="f-gill" cx="182" cy="118" rx="8" ry="22" transform="rotate(122 182 118)"/>' },
        // Stage 3 (behind body): back legs
        { s: 3, svg: '<ellipse class="f-pinkdark" cx="94" cy="202" rx="14" ry="10"/><ellipse class="f-pinkdark" cx="146" cy="202" rx="14" ry="10"/>' +
          '<circle class="f-pinkdark" cx="84" cy="210" r="4"/><circle class="f-pinkdark" cx="94" cy="212" r="4"/><circle class="f-pinkdark" cx="104" cy="210" r="4"/>' +
          '<circle class="f-pinkdark" cx="136" cy="210" r="4"/><circle class="f-pinkdark" cx="146" cy="212" r="4"/><circle class="f-pinkdark" cx="156" cy="210" r="4"/>' },
        // Stage 1: body and head
        { s: 1, svg: '<ellipse class="f-pink" cx="120" cy="160" rx="42" ry="46"/><ellipse class="f-pink" cx="120" cy="94" rx="60" ry="44"/>' },
        // Stage 3: front legs and toes
        { s: 3, svg: '<ellipse class="f-pinkdark" cx="80" cy="170" rx="10" ry="22" transform="rotate(32 80 170)"/>' +
          '<ellipse class="f-pinkdark" cx="160" cy="170" rx="10" ry="22" transform="rotate(-32 160 170)"/>' +
          '<circle class="f-pinkdark" cx="62" cy="184" r="4"/><circle class="f-pinkdark" cx="68" cy="192" r="4"/><circle class="f-pinkdark" cx="76" cy="194" r="4"/>' +
          '<circle class="f-pinkdark" cx="178" cy="184" r="4"/><circle class="f-pinkdark" cx="172" cy="192" r="4"/><circle class="f-pinkdark" cx="164" cy="194" r="4"/>' },
        // Stage 4: face
        { s: 4, svg: '<circle class="f-ink" cx="96" cy="88" r="7"/><circle class="f-ink" cx="144" cy="88" r="7"/>' +
          '<circle class="f-white" cx="98" cy="85" r="2.4"/><circle class="f-white" cx="146" cy="85" r="2.4"/>' +
          '<ellipse class="f-blush" cx="84" cy="106" rx="8" ry="4.5"/><ellipse class="f-blush" cx="156" cy="106" rx="8" ry="4.5"/>' +
          '<path class="ln s-ink" d="M104 108 Q 120 122 136 108"/>' }
      ]
    }
  };

  function stageFor(pct) { return pct >= 100 ? 4 : pct >= 75 ? 3 : pct >= 50 ? 2 : pct >= 25 ? 1 : 0; }

  function blueprintSVG(type, stage, arriving, label) {
    var bp = BLUEPRINTS[type] || BLUEPRINTS.droid;
    var id = 'bp' + uid();
    arriving = arriving || [];
    var ghost = bp.parts.map(function (p) { return p.svg; }).join('');
    var lit = bp.parts.filter(function (p) { return p.s <= stage; }).map(function (p) {
      var i = arriving.indexOf(p.s);
      return '<g' + (i > -1 ? ' class="arrive" style="animation-delay:' + (i * 0.55).toFixed(2) + 's"' : '') + '>' + p.svg + '</g>';
    }).join('');
    var svg = '<svg class="bp" viewBox="0 0 240 240" role="img" aria-label="' + esc(label || bp.label + ' blueprint, stage ' + stage + ' of 4') + '">' +
      '<defs><pattern id="' + id + 'g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(56,189,248,.10)" stroke-width="1"/></pattern>' +
      '<filter id="' + id + 'f" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>' +
      '<rect width="240" height="240" fill="url(#' + id + 'g)"/>' +
      '<g class="ghost">' + ghost + '</g><g class="lit">' + lit + '</g></svg>';
    return svg.replace(/FID/g, id + 'f');
  }

  /* =========================================================
     Sample data
     ========================================================= */
  function seedData() {
    var s = {
      version: 3,
      settings: { pointsPerUnit: DEFAULT_CREDITS_PER_UNIT, currency: DEFAULT_CURRENCY, teamName: 'Operations squadron' },
      users: [
        { id: 'mgr', name: 'Morgan Hayes', role: 'manager' },
        { id: 'u1', name: 'Alex Rivera', role: 'member' },
        { id: 'u2', name: 'Sam Patel', role: 'member' }
      ],
      tasks: [], ledger: [], decisions: [], goals: {}
    };
    function iso(d, h) { return daysAgo(d, h).toISOString(); }
    function mission(o) { o.id = o.id || uid(); s.tasks.push(o); return o; }

    mission({ title: 'Refresh the supplier contact list', description: 'Check every supplier on the shared list has a current contact name and email.', category: 'Intel', points: 50, status: 'open', createdAt: iso(0, 8) });
    mission({ title: 'Write a one-page guide to expense claims', description: 'Plain steps, screenshots where they help, saved to the team site.', category: 'Briefings', points: 100, status: 'open', createdAt: iso(1, 9) });
    mission({ title: 'Reorganize the supply cupboard', description: 'Label shelves and list anything that needs reordering.', category: 'Logistics', points: 30, status: 'open', createdAt: iso(2, 9) });
    mission({ title: 'Build a weekly metrics chart', description: 'Add a chart tab to the team tracker showing missions closed per week.', category: 'Intel', points: 150, status: 'open', createdAt: iso(3, 9) });
    mission({ title: 'Shadow a client call', description: 'Join one client call this week and write up three takeaways for the squadron.', category: 'Training', points: 75, status: 'open', createdAt: iso(4, 9) });

    mission({ title: 'Archive last quarter\'s project folders', description: 'Move closed projects to the archive drive and update the index.', category: 'Logistics', points: 60, status: 'in_progress', assignee: 'u1', claimedAt: iso(3, 14), createdAt: iso(5, 9), note: 'Two folders are still in the live drive. Move them and resubmit.' });
    mission({ title: 'Tidy shared drive naming', description: 'Apply the naming convention to the top two folder levels.', category: 'Logistics', points: 80, status: 'pending', assignee: 'u2', claimedAt: iso(2, 9), submittedAt: iso(0, 9), createdAt: iso(6, 9) });
    mission({ title: 'Photograph and log spare equipment', description: 'Add each spare monitor, dock and headset to the asset sheet with a photo.', category: 'Maintenance', points: 45, status: 'open', createdAt: iso(4, 9) });
    s.decisions.push({ id: uid(), userId: 'u1', kind: 'task', title: 'Archive last quarter\'s project folders', points: 60, decision: 'rejected', note: 'Two folders are still in the live drive. Move them and resubmit.', at: iso(1, 16) });

    [
      ['u1', 'Create a new starter checklist', 'Briefings', 120, 2],
      ['u1', 'Proofread the client newsletter', 'Briefings', 90, 4],
      ['u1', 'Update the visitor sign-in sheet', 'Logistics', 40, 6],
      ['u2', 'Write a meeting room booking guide', 'Briefings', 100, 5],
      ['u2', 'Clean up the team distribution lists', 'Intel', 70, 3],
      ['u2', 'Collate training feedback forms', 'Training', 60, 7]
    ].forEach(function (d) {
      var at = iso(d[4], 15);
      mission({ title: d[1], description: '', category: d[2], points: d[3], status: 'done', assignee: d[0], claimedAt: iso(d[4] + 2, 9), submittedAt: iso(d[4], 11), approvedAt: at, createdAt: iso(d[4] + 3, 9) });
      s.ledger.push({ id: uid(), userId: d[0], type: 'earn', source: 'task', title: d[1], points: d[3], at: at });
      s.decisions.push({ id: uid(), userId: d[0], kind: 'task', title: d[1], points: d[3], decision: 'approved', at: at });
    });
    s.ledger.push({ id: uid(), userId: 'u1', type: 'payout', source: 'payout', title: 'Payout recorded by Commander', points: 100, at: iso(2, 17) });

    // Savings goals: vault balances are u1 150, u2 230
    s.goals.u1 = { name: 'Droid builder kit', target: 400, blueprint: 'droid', seenStage: 1, setAt: iso(5, 9) };
    s.goals.u2 = { name: 'Pet axolotl', target: 300, blueprint: 'axolotl', seenStage: 3, setAt: iso(6, 9) };

    s.ledger.sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    s.decisions.sort(function (a, b) { return a.at < b.at ? 1 : -1; });
    return s;
  }

  // Bring older saved data or backups up to the current shape
  function normalize(d) {
    delete d.daily; delete d.dailyItems;
    d.ledger = (d.ledger || []).filter(function (l) { return l.source !== 'daily'; });
    d.decisions = (d.decisions || []).filter(function (x) { return x.kind !== 'daily'; });
    d.tasks = d.tasks || [];
    d.goals = d.goals || {};
    d.version = 3;
    return d;
  }

  /* =========================================================
     State and queries
     ========================================================= */
  var state = readKey(STORE_KEY);
  if (!state || !state.users || !state.tasks) { state = seedData(); save(); }
  state = normalize(state);

  var savedUI = readKey(UI_KEY) || {};
  var ui = { user: savedUI.user || 'u1', tab: savedUI.tab || 'dashboard', cat: 'All', ledgerUser: 'all' };
  var afterRender = null;

  function user(id) { return state.users.find(function (u) { return u.id === id; }); }
  function operatives() { return state.users.filter(function (u) { return u.role === 'member'; }); }
  function me() { return user(ui.user) || state.users[0]; }
  function isCmd() { return me().role === 'manager'; }
  function nameOf(id) { var u = user(id); return u ? u.name : 'Former operative'; }

  function sumLedger(userId, type) {
    return state.ledger.filter(function (l) { return l.userId === userId && l.type === type; })
      .reduce(function (a, l) { return a + l.points; }, 0);
  }
  function earned(userId) { return sumLedger(userId, 'earn'); }
  function paidOut(userId) { return sumLedger(userId, 'payout'); }
  function balance(userId) { return earned(userId) - paidOut(userId); }

  function goalInfo(userId) {
    var g = state.goals[userId];
    if (!g || !(g.target > 0)) return null;
    var bal = Math.max(0, balance(userId));
    var pct = Math.min(100, Math.floor(bal / g.target * 100));
    return { goal: g, bal: bal, pct: pct, stage: stageFor(pct), remaining: Math.max(0, g.target - bal) };
  }

  function pendingQueue() {
    var q = state.tasks.filter(function (t) { return t.status === 'pending'; }).map(function (t) {
      return { kind: 'task', key: t.id, userId: t.assignee, title: t.title, points: t.points, at: t.submittedAt, category: t.category };
    });
    q.sort(function (a, b) { return a.at < b.at ? -1 : 1; });
    return q;
  }
  function pendingCredits(userId) {
    return pendingQueue().filter(function (p) { return p.userId === userId; }).reduce(function (a, p) { return a + p.points; }, 0);
  }
  function earnedSince(days) {
    var cutoff = daysAgo(days, 0).toISOString();
    return state.ledger.filter(function (l) { return l.type === 'earn' && l.at >= cutoff; }).reduce(function (a, l) { return a + l.points; }, 0);
  }
  function categories() {
    var set = {};
    state.tasks.forEach(function (t) { if (t.category) set[t.category] = true; });
    return Object.keys(set).sort();
  }

  /* =========================================================
     Rendering
     ========================================================= */
  var $ = function (id) { return document.getElementById(id); };

  function render() {
    if (!user(ui.user)) ui.user = (operatives()[0] || state.users[0]).id;
    if (ui.tab === 'settings' && !isCmd()) ui.tab = 'dashboard';
    $('todayLabel').textContent = state.settings.teamName + ', ' + new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    renderSwitcher();
    renderProfile();
    renderTabs();
    renderView();
    saveUI();
  }

  function renderSwitcher() {
    $('userSwitch').innerHTML = '<span class="who-label">Signed in as</span>' + state.users.map(function (u) {
      var cmd = u.role === 'manager';
      return '<button class="person" type="button" aria-pressed="' + (u.id === ui.user) + '" data-action="switchUser" data-id="' + u.id + '">' +
        '<span class="avatar' + (cmd ? ' cmd' : '') + '" aria-hidden="true">' + esc(initials(u.name)) + '</span>' +
        '<span>' + esc(u.name.split(' ')[0]) + '<span class="role">' + (cmd ? 'Commander' : 'Operative') + '</span></span></button>';
    }).join('');
  }

  function renderProfile() {
    var u = me();
    var cmd = u.role === 'manager';
    var html = '<div class="profile-inner"><div class="identity"><span class="avatar' + (cmd ? ' cmd' : '') + '" aria-hidden="true">' + esc(initials(u.name)) + '</span>' +
      '<div><h2>' + esc(u.name) + '</h2><p>' + (cmd ? 'Commander and approver' : 'Operative') + '</p></div></div>';
    if (cmd) {
      var q = pendingQueue();
      var owed = operatives().reduce(function (a, m) { return a + balance(m.id); }, 0);
      html += '<div class="vault"><span class="lbl">Reports awaiting your review</span>' +
        '<strong class="big">' + q.length + '<small>' + (q.length === 1 ? 'report' : 'reports') + '</small></strong>' +
        '<span class="equiv">' + num(q.reduce(function (a, p) { return a + p.points; }, 0)) + ' credits on hold</span></div>' +
        '<dl class="stats"><div><dt>Owed to operatives</dt><dd>' + money(owed) + '</dd></div>' +
        '<div><dt>Credits earned, last 7 days</dt><dd>' + num(earnedSince(7)) + '</dd></div></dl>';
    } else {
      var bal = balance(u.id);
      html += '<div class="vault"><span class="lbl">Credit Vault</span>' +
        '<strong class="big">' + num(bal) + '<small>credits</small></strong>' +
        '<span class="equiv">Worth ' + money(bal) + ' at ' + num(state.settings.pointsPerUnit) + ' credits = ' + esc(state.settings.currency) + '1.00</span></div>' +
        '<dl class="stats"><div><dt>Earned to date</dt><dd>' + num(earned(u.id)) + '</dd></div>' +
        '<div><dt>Awaiting review</dt><dd>' + num(pendingCredits(u.id)) + '</dd></div></dl>';
    }
    $('profile').innerHTML = html + '</div>';
  }

  function tabList() {
    var cmd = isCmd();
    var t = [
      ['dashboard', cmd ? 'Command deck' : 'My station'],
      ['backlog', 'Mission board'],
      ['approvals', cmd ? 'Approvals' : 'My reports'],
      ['balances', 'Credit Vault']
    ];
    if (cmd) t.push(['settings', 'Settings']);
    return t;
  }

  function renderTabs() {
    var q = pendingQueue();
    var mine = q.filter(function (p) { return p.userId === ui.user; }).length;
    $('tabs').innerHTML = tabList().map(function (t) {
      var badge = '';
      if (t[0] === 'approvals') {
        var c = isCmd() ? q.length : mine;
        if (c) badge = '<span class="count" aria-label="' + c + ' pending">' + c + '</span>';
      }
      return '<button class="tab" role="tab" aria-selected="' + (ui.tab === t[0]) + '" data-action="tab" data-tab="' + t[0] + '">' + t[1] + badge + '</button>';
    }).join('');
  }

  function renderView() {
    var v = {
      dashboard: isCmd() ? viewCommandDeck : viewStation,
      backlog: isCmd() ? viewCommandBoard : viewOperativeBoard,
      approvals: isCmd() ? viewApprovals : viewMyReports,
      balances: isCmd() ? viewCommandVault : viewMyVault,
      settings: viewSettings
    }[ui.tab] || viewStation;
    afterRender = null;
    $('view').innerHTML = v();
    if (afterRender) { var fn = afterRender; afterRender = null; fn(); }
  }

  function emptyState(title, text) {
    return '<div class="empty"><strong>' + esc(title) + '</strong>' + esc(text) + '</div>';
  }

  function meterHTML(pct, extraClass) {
    return '<div class="meter ' + (extraClass || '') + '" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '" aria-label="Goal progress">' +
      '<div class="meter-fill' + (pct >= 100 ? ' full' : '') + '" style="width:' + pct + '%"></div>' +
      '<div class="meter-ticks"><span style="left:25%"></span><span style="left:50%"></span><span style="left:75%"></span></div></div>';
  }

  /* ---------- Goal and Blueprint Bay ---------- */
  function goalBayHTML(userId) {
    var info = goalInfo(userId);
    if (!info) {
      return '<section class="panel bay" aria-labelledby="bayTitle">' +
        '<div class="bay-visual"><span class="bay-tag">No blueprint loaded</span>' + blueprintSVG('droid', 0, [], 'Empty blueprint') + '</div>' +
        '<div><h2 id="bayTitle">Goal and Blueprint Bay</h2>' +
        '<p class="sub" style="margin:8px 0 18px">Pick something to save your credits toward. It assembles piece by piece at 25, 50, 75 and 100 percent of your goal.</p>' +
        '<button class="btn accent" data-action="editGoal">Set a goal</button></div></section>';
    }
    var g = info.goal, bp = BLUEPRINTS[g.blueprint] || BLUEPRINTS.droid;
    var seen = Math.min(g.seenStage || 0, 4);
    var arriving = [];
    for (var st = seen + 1; st <= info.stage; st++) arriving.push(st);
    if (info.stage !== seen) {
      afterRender = function () {
        g.seenStage = info.stage; save();
        if (arriving.length) toast(info.stage === 4 ? 'Blueprint complete: ' + g.name + ' is fully assembled!' : 'New component installed: ' + bp.stages[info.stage - 1]);
      };
    }
    var done = info.pct >= 100;
    var stagesHTML = bp.stages.map(function (name, i) {
      var n = i + 1, on = info.stage >= n;
      var need = Math.ceil(g.target * n / 4);
      return '<li class="stage' + (on ? ' on' : '') + '"><b>' + (n * 25) + '%</b><span>' + esc(name) + '</span>' +
        '<span class="lock">' + (on ? 'Installed' : num(need) + ' cr') + '</span></li>';
    }).join('');

    return '<section class="panel bay" aria-labelledby="bayTitle">' +
      '<div class="bay-visual"><span class="bay-tag' + (done ? ' done' : '') + '">' + (done ? 'Blueprint complete' : 'Stage ' + info.stage + ' of 4') + '</span>' +
      blueprintSVG(g.blueprint, info.stage, arriving, g.name + ', ' + bp.label + ' blueprint, ' + info.stage + ' of 4 components installed') + '</div>' +
      '<div><div class="panel-head" style="margin-bottom:0"><div><h2 id="bayTitle">Goal and Blueprint Bay</h2></div>' +
      '<button class="btn ghost small" data-action="editGoal">Edit goal</button></div>' +
      '<p class="goal-name">' + esc(g.name) + '</p>' +
      meterHTML(info.pct) +
      '<div class="meter-row"><span>Progress</span><strong>' + info.pct + '%</strong></div>' +
      '<div class="goal-stats"><div><strong>' + num(info.bal) + '</strong>In your vault</div>' +
      '<div><strong>' + num(g.target) + '</strong>Goal credits</div>' +
      '<div><strong>' + num(info.remaining) + '</strong>Credits to go</div></div>' +
      '<ul class="stages" aria-label="Blueprint components">' + stagesHTML + '</ul>' +
      (done ? '<p class="note">Goal reached. Ask your Commander to record the payout, then set your next goal.</p>' :
        '<p class="sub">Next component unlocks at ' + num(Math.ceil(g.target * (info.stage + 1) / 4)) + ' credits.</p>') +
      '</div></section>';
  }

  function miniGoalHTML(userId) {
    var info = goalInfo(userId);
    if (!info) return '<div class="mini-goal"><div class="bay-visual">' + blueprintSVG('droid', 0, [], 'No goal set') + '</div><p class="sub">No savings goal set yet.</p></div>';
    return '<div class="mini-goal"><div class="bay-visual">' + blueprintSVG(info.goal.blueprint, info.stage, [], info.goal.name + ', stage ' + info.stage + ' of 4') + '</div>' +
      '<div><p class="goal-line">' + esc(info.goal.name) + '</p>' + meterHTML(info.pct) +
      '<p class="sub" style="margin-top:6px">' + info.pct + '%, ' + num(info.remaining) + ' credits to go</p></div></div>';
  }

  /* ---------- Operative: My station ---------- */
  function myMissionsHTML(userId) {
    var list = state.tasks.filter(function (t) { return t.assignee === userId && (t.status === 'in_progress' || t.status === 'pending'); });
    if (!list.length) return emptyState('No active missions', 'Accept a mission from the board to start earning credits.') +
      '<div class="btn-row" style="justify-content:center;margin-top:12px"><button class="btn secondary small" data-action="tab" data-tab="backlog">Open the mission board</button></div>';
    return '<ul class="rows">' + list.map(function (t) {
      var actions, chip;
      if (t.status === 'pending') {
        chip = '<span class="chip pending">Awaiting review</span>';
        actions = '<button class="btn ghost small" data-action="withdrawTask" data-id="' + t.id + '">Withdraw report</button>';
      } else {
        chip = t.note ? '<span class="chip returned">Returned</span>' : '<span class="chip progress">In progress</span>';
        actions = '<button class="btn ghost small" data-action="releaseTask" data-id="' + t.id + '">Release</button>' +
          '<button class="btn small" data-action="submitTask" data-id="' + t.id + '">Report complete</button>';
      }
      return '<li class="row"><div><div class="row-title">' + esc(t.title) + '</div>' +
        '<div class="row-meta">' + chip + '<span class="cr">+' + num(t.points) + ' cr</span><span>' + esc(t.category) + '</span>' +
        '<span>Accepted ' + fmtDate(t.claimedAt) + '</span></div>' +
        (t.note && t.status === 'in_progress' ? '<span class="note">Commander note: ' + esc(t.note) + '</span>' : '') +
        '</div><div class="row-actions">' + actions + '</div></li>';
    }).join('') + '</ul>';
  }

  function viewStation() {
    var u = me();
    var recent = state.ledger.filter(function (l) { return l.userId === u.id; }).slice(0, 5);
    var openList = state.tasks.filter(function (t) { return t.status === 'open'; })
      .sort(function (a, b) { return (a.createdAt || '') < (b.createdAt || '') ? 1 : -1; });
    var fresh = openList.slice(0, 3);
    return '<div class="stack">' + goalBayHTML(u.id) +
      '<div class="grid-2">' +
      '<section class="panel"><div class="panel-head"><div><h2>My active missions</h2>' +
      '<p class="sub">Missions you have accepted. Report each one complete and your Commander will review it.</p></div></div>' +
      myMissionsHTML(u.id) + '</section>' +
      '<div class="stack">' +
      '<section class="panel"><div class="panel-head"><div><h2>New missions</h2><p class="sub">' + openList.length + ' open on the board.</p></div>' +
      (openList.length ? '<button class="btn ghost small" data-action="tab" data-tab="backlog">See all</button>' : '') + '</div>' +
      (fresh.length ? '<ul class="rows">' + fresh.map(function (t) {
        return '<li class="row"><div><div class="row-title">' + esc(t.title) + '</div><div class="row-meta">' +
          '<span class="cr">+' + num(t.points) + ' cr</span><span>' + money(t.points) + '</span><span>' + esc(t.category || 'General') + '</span></div></div>' +
          '<div class="row-actions"><button class="btn small" data-action="claimTask" data-id="' + t.id + '">Accept mission</button></div></li>';
      }).join('') + '</ul>' : emptyState('No open missions', 'New missions from your Commander will appear here.')) + '</section>' +
      '<section class="panel"><div class="panel-head"><div><h2>Recent credits</h2></div>' +
      '<button class="btn ghost small" data-action="tab" data-tab="balances">Full ledger</button></div>' +
      (recent.length ? ledgerTableHTML(recent, false) : emptyState('No credits yet', 'Approved missions will show up here.')) +
      '</section></div></div></div>';
  }

  /* ---------- Commander: Command deck ---------- */
  function viewCommandDeck() {
    var q = pendingQueue();
    var cards = operatives().map(function (m) {
      var mine = state.tasks.filter(function (t) { return t.assignee === m.id; });
      var active = mine.filter(function (t) { return t.status === 'in_progress'; });
      var waiting = mine.filter(function (t) { return t.status === 'pending'; });
      var done = mine.filter(function (t) { return t.status === 'done'; });
      return '<section class="panel member-card">' +
        '<div class="who-line"><span class="avatar sm" aria-hidden="true">' + esc(initials(m.name)) + '</span><div><h3>' + esc(m.name) + '</h3>' +
        '<p class="sub">' + active.length + ' in progress, ' + waiting.length + ' awaiting review</p></div></div>' +
        '<div class="mini-stats"><div><strong>' + num(balance(m.id)) + '</strong>Vault credits</div>' +
        '<div><strong>' + done.length + '</strong>Missions done</div>' +
        '<div><strong>' + money(balance(m.id)) + '</strong>Value</div></div>' +
        miniGoalHTML(m.id) +
        (active.length ? '<p class="sub" style="margin-top:12px">On mission: ' + active.map(function (t) { return esc(t.title); }).join(', ') + '</p>' : '') +
        '</section>';
    }).join('');

    return '<div class="stack">' +
      '<section class="panel"><div class="panel-head"><div><h2>Reports awaiting review</h2><p class="sub">Oldest first.</p></div>' +
      (q.length ? '<button class="btn secondary small" data-action="tab" data-tab="approvals">Open approvals (' + q.length + ')</button>' : '') + '</div>' +
      (q.length ? queueRowsHTML(q.slice(0, 4)) : emptyState('All clear', 'Completed missions from your operatives will appear here.')) + '</section>' +
      '<div><h2 class="section-title">Operatives</h2><div class="grid-3">' +
      (cards || emptyState('No operatives', 'Add operatives in Settings.')) + '</div></div></div>';
  }

  /* ---------- Mission board ---------- */
  function ticketHTML(t, mode) {
    var foot = '';
    if (mode === 'claim') foot = '<button class="btn small" data-action="claimTask" data-id="' + t.id + '">Accept mission</button>';
    if (mode === 'manage') foot = '<button class="btn ghost small" data-action="editTask" data-id="' + t.id + '">Edit</button>' +
      '<button class="btn ghost small" data-action="deleteTask" data-id="' + t.id + '">Delete</button>';
    return '<article class="ticket"><div class="stub"><span class="stub-cr">' + num(t.points) + '</span><span class="stub-unit">credits</span>' +
      '<span class="stub-money">' + money(t.points) + '</span></div>' +
      '<div class="ticket-body"><span class="cat">' + esc(t.category || 'General') + '</span>' +
      '<h3>' + esc(t.title) + '</h3><p>' + esc(t.description || '') + '</p>' +
      '<div class="ticket-foot">' + foot + '</div></div></article>';
  }

  function filtersHTML() {
    return '<div class="filters" role="group" aria-label="Filter by category">' + ['All'].concat(categories()).map(function (c) {
      return '<button class="filter" aria-pressed="' + (ui.cat === c) + '" data-action="filterCat" data-cat="' + esc(c) + '">' + esc(c) + '</button>';
    }).join('') + '</div>';
  }
  function openFiltered() {
    return state.tasks.filter(function (t) { return t.status === 'open' && (ui.cat === 'All' || t.category === ui.cat); });
  }

  function viewOperativeBoard() {
    var open = openFiltered();
    return '<section class="panel"><div class="panel-head"><div><h2>Mission board</h2>' +
      '<p class="sub">Directives posted by your Commander. Accept one, complete it, then report it complete for review.</p></div></div>' +
      filtersHTML() +
      (open.length ? '<div class="tickets">' + open.map(function (t) { return ticketHTML(t, 'claim'); }).join('') + '</div>'
        : emptyState('No open missions', ui.cat === 'All' ? 'Check back soon for new directives.' : 'Try another category.')) + '</section>';
  }

  function viewCommandBoard() {
    var open = openFiltered();
    var claimed = state.tasks.filter(function (t) { return t.status === 'in_progress' || t.status === 'pending'; });
    var done = state.tasks.filter(function (t) { return t.status === 'done'; })
      .sort(function (a, b) { return (a.approvedAt || '') < (b.approvedAt || '') ? 1 : -1; }).slice(0, 10);
    var catOptions = categories().map(function (c) { return '<option value="' + esc(c) + '">'; }).join('');
    return '<div class="stack">' +
      '<section class="panel"><div class="panel-head"><div><h2>Post a new mission</h2><p class="sub">Operatives can accept it straight away.</p></div></div>' +
      '<form data-form="addTask" class="form-grid" autocomplete="off">' +
      '<label class="field full">Mission title<input name="title" required maxlength="90" placeholder="For example: Update the client contact sheet"></label>' +
      '<label class="field full">Briefing<textarea name="description" maxlength="300" placeholder="What mission complete looks like"></textarea></label>' +
      '<label class="field">Category<input name="category" list="catList" required maxlength="30" placeholder="Logistics"><datalist id="catList">' + catOptions + '</datalist></label>' +
      '<label class="field">Credit reward<input name="points" type="number" min="1" step="1" required value="50"></label>' +
      '<div class="full btn-row"><button class="btn" type="submit">Post mission</button></div></form></section>' +

      '<section class="panel"><div class="panel-head"><div><h2>Open missions</h2><p class="sub">' +
      state.tasks.filter(function (t) { return t.status === 'open'; }).length + ' available to accept.</p></div></div>' + filtersHTML() +
      (open.length ? '<div class="tickets">' + open.map(function (t) { return ticketHTML(t, 'manage'); }).join('') + '</div>'
        : emptyState('No open missions', 'Post one above to give your operatives something to accept.')) + '</section>' +

      '<section class="panel"><div class="panel-head"><div><h2>Missions underway</h2><p class="sub">In progress or awaiting review.</p></div></div>' +
      (claimed.length ? '<ul class="rows">' + claimed.map(function (t) {
        return '<li class="row"><div><div class="row-title">' + esc(t.title) + '</div><div class="row-meta">' +
          (t.status === 'pending' ? '<span class="chip pending">Awaiting review</span>' : '<span class="chip progress">In progress</span>') +
          '<span class="cr">+' + num(t.points) + ' cr</span><span>' + esc(nameOf(t.assignee)) + '</span><span>Accepted ' + fmtDate(t.claimedAt) + '</span></div></div>' +
          '<div class="row-actions"><button class="btn ghost small" data-action="returnToBoard" data-id="' + t.id + '">Return to board</button></div></li>';
      }).join('') + '</ul>' : emptyState('No missions underway', 'Accepted missions will show here.')) + '</section>' +

      (done.length ? '<section class="panel"><div class="panel-head"><div><h2>Recently completed</h2></div></div><ul class="rows">' +
        done.map(function (t) {
          return '<li class="row"><div><div class="row-title">' + esc(t.title) + '</div><div class="row-meta"><span class="chip approved">Complete</span>' +
            '<span class="cr">+' + num(t.points) + ' cr</span><span>' + esc(nameOf(t.assignee)) + '</span><span>Approved ' + fmtDate(t.approvedAt) + '</span></div></div>' +
            '<div class="row-actions"><button class="btn ghost small" data-action="reopenTask" data-id="' + t.id + '">Repost</button></div></li>';
        }).join('') + '</ul></section>' : '') + '</div>';
  }

  /* ---------- Approvals ---------- */
  function queueRowsHTML(list) {
    return '<ul class="rows">' + list.map(function (p) {
      return '<li class="row"><div class="who-line"><span class="avatar sm" aria-hidden="true">' + esc(initials(nameOf(p.userId))) + '</span>' +
        '<div><div class="row-title">' + esc(p.title) + '</div><div class="row-meta"><span>' + esc(nameOf(p.userId)) + '</span><span>' + esc(p.category || 'General') + '</span>' +
        '<span>Reported ' + fmtDateTime(p.at) + '</span></div></div></div>' +
        '<div class="row-actions"><span class="cr">+' + num(p.points) + ' cr</span>' +
        '<button class="btn secondary small" data-action="reject" data-key="' + esc(p.key) + '">Reject</button>' +
        '<button class="btn small" data-action="approve" data-key="' + esc(p.key) + '">Approve</button></div></li>';
    }).join('') + '</ul>';
  }

  function decisionsHTML(list, showName) {
    if (!list.length) return emptyState('No decisions yet', 'Approved and rejected reports will be logged here.');
    return '<ul class="rows">' + list.map(function (d) {
      var ok = d.decision === 'approved';
      return '<li class="row"><div><div class="row-title">' + esc(d.title) + '</div><div class="row-meta">' +
        (ok ? '<span class="chip approved">Approved</span>' : '<span class="chip returned">Rejected</span>') +
        (showName ? '<span>' + esc(nameOf(d.userId)) + '</span>' : '') + '<span>' + fmtDateTime(d.at) + '</span></div>' +
        (d.note ? '<span class="note">' + esc(d.note) + '</span>' : '') + '</div>' +
        '<div class="row-actions"><span class="cr' + (ok ? '' : ' neg') + '">' + (ok ? '+' + num(d.points) + ' cr' : '0 cr') + '</span></div></li>';
    }).join('') + '</ul>';
  }

  function viewApprovals() {
    var q = pendingQueue();
    var recent = state.decisions.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; }).slice(0, 15);
    return '<div class="grid-2">' +
      '<section class="panel"><div class="panel-head"><div><h2>Reports awaiting review</h2>' +
      '<p class="sub">Approving credits the operative\'s vault immediately and advances their blueprint.</p></div>' +
      (q.length > 1 ? '<button class="btn accent small" data-action="approveAll">Approve all (' + q.length + ')</button>' : '') + '</div>' +
      (q.length ? queueRowsHTML(q) : emptyState('All clear', 'Nothing is waiting for review.')) + '</section>' +
      '<section class="panel"><div class="panel-head"><div><h2>Recent decisions</h2></div></div>' + decisionsHTML(recent, true) + '</section></div>';
  }

  function viewMyReports() {
    var mine = pendingQueue().filter(function (p) { return p.userId === ui.user; });
    var recent = state.decisions.filter(function (d) { return d.userId === ui.user; })
      .sort(function (a, b) { return a.at < b.at ? 1 : -1; }).slice(0, 15);
    return '<div class="grid-2">' +
      '<section class="panel"><div class="panel-head"><div><h2>Awaiting review</h2><p class="sub">Credits land in your vault once your Commander approves.</p></div></div>' +
      (mine.length ? '<ul class="rows">' + mine.map(function (p) {
        return '<li class="row"><div><div class="row-title">' + esc(p.title) + '</div><div class="row-meta"><span class="chip pending">Awaiting review</span>' +
          '<span>Reported ' + fmtDateTime(p.at) + '</span></div></div><div class="row-actions"><span class="cr">+' + num(p.points) + ' cr</span></div></li>';
      }).join('') + '</ul>' : emptyState('Nothing awaiting review', 'Report an accepted mission complete to send it to your Commander.')) + '</section>' +
      '<section class="panel"><div class="panel-head"><div><h2>Decisions on my missions</h2></div></div>' + decisionsHTML(recent, false) + '</section></div>';
  }

  /* ---------- Credit Vault ---------- */
  function rateHTML() {
    var s = state.settings, per = 1 / s.pointsPerUnit;
    return '<section class="panel"><div class="rate"><div class="rate-figure"><span class="c">' + num(s.pointsPerUnit) + ' credits</span><span class="eq">=</span>' + esc(s.currency) + '1.00</div>' +
      '<p>Exchange rate. 1 credit is worth ' + esc(s.currency) + (per < 0.01 ? per.toFixed(4) : per.toFixed(2)) + '.' + (isCmd() ? ' Change it in Settings.' : '') + '</p></div></section>';
  }

  function ledgerTableHTML(list, showName) {
    return '<div class="table-wrap"><table><thead><tr><th>Date</th>' + (showName ? '<th>Operative</th>' : '') +
      '<th>Entry</th><th>Type</th><th class="num">Credits</th><th class="num">Value</th></tr></thead><tbody>' +
      list.map(function (l) {
        var out = l.type === 'payout';
        return '<tr><td>' + fmtDate(l.at) + '</td>' + (showName ? '<td>' + esc(nameOf(l.userId)) + '</td>' : '') +
          '<td>' + esc(l.title) + '</td><td>' + (out ? 'Payout' : 'Mission approved') + '</td>' +
          '<td class="num"><span class="cr' + (out ? ' neg' : '') + '">' + (out ? '-' : '+') + num(l.points) + '</span></td>' +
          '<td class="num">' + (out ? '-' : '') + money(l.points) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function viewMyVault() {
    var u = me();
    var list = state.ledger.filter(function (l) { return l.userId === u.id; });
    return '<div class="stack">' + rateHTML() +
      '<section class="panel"><div class="panel-head"><div><h2>Vault summary</h2></div></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Earned to date</th><th>Paid out</th><th>In vault</th><th class="num">Vault value</th></tr></thead>' +
      '<tbody><tr><td>' + num(earned(u.id)) + ' cr</td><td>' + num(paidOut(u.id)) + ' cr</td><td><strong>' + num(balance(u.id)) + ' cr</strong></td>' +
      '<td class="num"><strong>' + money(balance(u.id)) + '</strong></td></tr></tbody></table></div></section>' +
      '<section class="panel"><div class="panel-head"><div><h2>Credit ledger</h2><p class="sub">Every approved mission and payout.</p></div></div>' +
      (list.length ? ledgerTableHTML(list, false) : emptyState('No entries yet', 'Approved missions will be logged here.')) + '</section></div>';
  }

  function viewCommandVault() {
    var rows = operatives().map(function (m) {
      var info = goalInfo(m.id);
      return '<tr><td><strong>' + esc(m.name) + '</strong></td><td class="num">' + num(earned(m.id)) + '</td><td class="num">' + num(paidOut(m.id)) + '</td>' +
        '<td class="num"><strong>' + num(balance(m.id)) + '</strong></td><td class="num">' + money(balance(m.id)) + '</td>' +
        '<td>' + (info ? esc(info.goal.name) + ', ' + info.pct + '%' : '<span class="sub">No goal</span>') + '</td>' +
        '<td class="num"><button class="btn secondary small" data-action="payout" data-id="' + m.id + '"' + (balance(m.id) > 0 ? '' : ' disabled') + '>Record payout</button></td></tr>';
    }).join('');
    var list = state.ledger.filter(function (l) { return ui.ledgerUser === 'all' || l.userId === ui.ledgerUser; });
    var opts = '<option value="all">All operatives</option>' + operatives().map(function (m) {
      return '<option value="' + m.id + '"' + (ui.ledgerUser === m.id ? ' selected' : '') + '>' + esc(m.name) + '</option>';
    }).join('');
    return '<div class="stack">' + rateHTML() +
      '<section class="panel"><div class="panel-head"><div><h2>Operative vaults</h2>' +
      '<p class="sub">Record a payout when credits are exchanged. It is deducted from the vault and the goal progress updates.</p></div></div>' +
      '<div class="table-wrap"><table><thead><tr><th>Operative</th><th class="num">Earned</th><th class="num">Paid out</th><th class="num">In vault</th><th class="num">Value</th><th>Goal</th>' +
      '<th class="num"><span class="sr-only">Actions</span></th></tr></thead><tbody>' + rows + '</tbody></table></div></section>' +
      '<section class="panel"><div class="panel-head"><div><h2>Credit ledger</h2></div>' +
      '<label class="field" style="min-width:220px"><span class="sr-only">Filter ledger</span><select data-change="ledgerUser">' + opts + '</select></label></div>' +
      (list.length ? ledgerTableHTML(list, true) : emptyState('No entries', 'Nothing logged for this filter yet.')) + '</section></div>';
  }

  /* ---------- Settings ---------- */
  function viewSettings() {
    var s = state.settings;
    var team = state.users.map(function (u) {
      return '<label class="field">' + (u.role === 'manager' ? 'Commander' : 'Operative') +
        '<input name="name_' + u.id + '" value="' + esc(u.name) + '" required maxlength="40"></label>';
    }).join('');
    var ops = operatives();
    var roster = ops.length ? '<ul class="rows">' + ops.map(function (m) {
      var info = goalInfo(m.id);
      return '<li class="row"><div class="who-line"><span class="avatar sm" aria-hidden="true">' + esc(initials(m.name)) + '</span><div>' +
        '<div class="row-title">' + esc(m.name) + '</div><div class="row-meta"><span>' + num(balance(m.id)) + ' credits in vault</span>' +
        (info ? '<span>Goal: ' + esc(info.goal.name) + '</span>' : '') + '</div></div></div>' +
        '<div class="row-actions"><button class="btn ghost small" type="button" data-action="removeOperative" data-id="' + m.id + '">Remove operative</button></div></li>';
    }).join('') + '</ul>' : emptyState('No operatives', 'Add one below.');
    var canAdd = ops.length < MAX_OPERATIVES;
    return '<div class="stack">' +
      '<section class="panel"><div class="panel-head"><div><h2>Credits and squadron</h2></div></div>' +
      '<form data-form="settings" class="form-grid" autocomplete="off">' +
      '<label class="field">Credits per ' + esc(s.currency) + '1.00<input name="rate" type="number" min="1" step="1" value="' + s.pointsPerUnit + '" required>' +
      '<span class="hint">100 means 1 credit = ' + esc(s.currency) + '0.01. 10 means 1 credit = ' + esc(s.currency) + '0.10.</span></label>' +
      '<label class="field">Currency symbol<input name="currency" value="' + esc(s.currency) + '" maxlength="3" required></label>' +
      '<label class="field full">Squadron name<input name="teamName" value="' + esc(s.teamName) + '" maxlength="40" required></label>' + team +
      '<div class="full btn-row"><button class="btn" type="submit">Save settings</button></div></form></section>' +
      '<section class="panel"><div class="panel-head"><div><h2>Squadron roster</h2>' +
      '<p class="sub">' + ops.length + ' of up to ' + MAX_OPERATIVES + ' operatives. Removing an operative returns their active missions to the board; their past ledger entries are kept.</p></div></div>' +
      roster +
      (canAdd ? '<form data-form="addOperative" class="form-grid" autocomplete="off" style="margin-top:16px">' +
        '<label class="field">New operative name<input name="name" required maxlength="40" placeholder="First and last name"></label>' +
        '<div class="btn-row" style="align-self:end"><button class="btn secondary" type="submit">Add operative</button></div></form>' : '') +
      '</section>' +
      '<section class="panel"><div class="panel-head"><div><h2>Data</h2>' +
      '<p class="sub">Everything, including goals, is saved in this browser only. Export a backup before clearing browser data or moving devices.</p></div></div>' +
      '<div class="btn-row"><button class="btn secondary" data-action="exportData">Export backup</button>' +
      '<button class="btn secondary" data-action="importData">Import backup</button>' +
      '<button class="btn accent" data-action="resetData">Reset and load sample data</button>' +
      '<button class="btn ghost" data-action="clearData">Start empty</button></div></section></div>';
  }

  /* =========================================================
     Modal and toast
     ========================================================= */
  var modalHandler = null, lastFocus = null;
  function openModal(o) {
    lastFocus = document.activeElement;
    var m = $('modal');
    m.innerHTML = '<div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><form id="modalForm" autocomplete="off">' +
      '<h2 id="modalTitle">' + esc(o.title) + '</h2><div class="modal-body">' + (o.body || '') + '</div>' +
      '<div class="modal-actions">' + (o.extra || '') + '<button type="button" class="btn ghost" data-action="closeModal">Cancel</button>' +
      '<button type="submit" class="btn">' + esc(o.confirm || 'Confirm') + '</button></div></form></div>';
    m.hidden = false;
    modalHandler = o.onConfirm;
    var first = m.querySelector('input:not([type="radio"]), textarea, select') || m.querySelector('button[type="submit"]');
    if (first) first.focus();
  }
  function closeModal() {
    $('modal').hidden = true; $('modal').innerHTML = ''; modalHandler = null;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 3000);
  }
  function commit(msg) { save(); render(); if (msg) toast(msg); }

  /* =========================================================
     Workflow
     ========================================================= */
  function findTask(id) { return state.tasks.find(function (x) { return x.id === id; }); }
  function credit(userId, title, credits) {
    state.ledger.unshift({ id: uid(), userId: userId, type: 'earn', source: 'task', title: title, points: credits, at: nowISO() });
  }
  function logDecision(t, decision, note) {
    state.decisions.unshift({ id: uid(), userId: t.assignee, kind: 'task', title: t.title, points: t.points, decision: decision, note: note || '', at: nowISO() });
    if (state.decisions.length > 300) state.decisions.length = 300;
  }
  function approveMission(id) {
    var t = findTask(id);
    if (!t || t.status !== 'pending') return false;
    t.status = 'done'; t.approvedAt = nowISO(); delete t.note;
    credit(t.assignee, t.title, t.points);
    logDecision(t, 'approved');
    return true;
  }

  var actions = {
    tab: function (d) { ui.tab = d.tab; render(); window.scrollTo(0, 0); },
    filterCat: function (d) { ui.cat = d.cat; renderView(); },
    closeModal: closeModal,
    switchUser: function (d) {
      if (d.id === ui.user) return;
      ui.user = d.id;
      if (ui.tab === 'settings' && !isCmd()) ui.tab = 'dashboard';
      render(); window.scrollTo(0, 0);
      if (!document.getElementById('toast').classList.contains('show')) toast('Signed in as ' + me().name);
    },

    claimTask: function (d) {
      var t = findTask(d.id);
      if (!t || t.status !== 'open') return toast('That mission has already been accepted.');
      t.status = 'in_progress'; t.assignee = ui.user; t.claimedAt = nowISO(); delete t.note;
      commit('Mission accepted: ' + t.title);
    },
    releaseTask: function (d) {
      var t = findTask(d.id); if (!t) return;
      t.status = 'open'; delete t.assignee; delete t.claimedAt; delete t.note;
      commit('Mission released back to the board');
    },
    submitTask: function (d) {
      var t = findTask(d.id); if (!t) return;
      t.status = 'pending'; t.submittedAt = nowISO();
      commit('Report sent to your Commander: ' + t.title);
    },
    withdrawTask: function (d) {
      var t = findTask(d.id); if (!t) return;
      t.status = 'in_progress'; delete t.submittedAt;
      commit('Report withdrawn');
    },

    approve: function (d) {
      var t = findTask(d.key);
      if (t && approveMission(d.key)) commit('Approved: +' + num(t.points) + ' credits to ' + nameOf(t.assignee));
      else render();
    },
    approveAll: function () {
      var q = pendingQueue();
      openModal({
        title: 'Approve all ' + q.length + ' reports?',
        body: '<p>This transfers ' + num(q.reduce(function (a, p) { return a + p.points; }, 0)) + ' credits across your operatives\' vaults.</p>',
        confirm: 'Approve all',
        onConfirm: function () { var n = 0; q.forEach(function (p) { if (approveMission(p.key)) n++; }); commit('Approved ' + n + ' reports'); }
      });
    },
    reject: function (d) {
      var t = findTask(d.key);
      if (!t || t.status !== 'pending') return render();
      openModal({
        title: 'Reject ' + t.title + '?',
        body: '<p>' + esc(nameOf(t.assignee)) + ' will see your note and can report it again.</p>' +
          '<label class="field">Note for ' + esc(nameOf(t.assignee)) + '<textarea name="note" maxlength="200" placeholder="What needs to change"></textarea></label>',
        confirm: 'Reject',
        onConfirm: function (f) {
          var note = f.note.value.trim();
          t.status = 'in_progress'; t.note = note || 'Returned for more work.'; delete t.submittedAt;
          logDecision(t, 'rejected', note);
          commit('Rejected and returned to ' + nameOf(t.assignee));
        }
      });
    },

    editTask: function (d) {
      var t = findTask(d.id); if (!t) return;
      openModal({
        title: 'Edit mission',
        body: '<label class="field">Mission title<input name="title" required maxlength="90" value="' + esc(t.title) + '"></label>' +
          '<label class="field">Briefing<textarea name="description" maxlength="300">' + esc(t.description || '') + '</textarea></label>' +
          '<label class="field">Category<input name="category" required maxlength="30" value="' + esc(t.category || '') + '"></label>' +
          '<label class="field">Credit reward<input name="points" type="number" min="1" step="1" required value="' + t.points + '"></label>',
        confirm: 'Save changes',
        onConfirm: function (f) {
          t.title = f.title.value.trim(); t.description = f.description.value.trim();
          t.category = f.category.value.trim(); t.points = Math.max(1, parseInt(f.points.value, 10) || 1);
          commit('Mission updated');
        }
      });
    },
    deleteTask: function (d) {
      var t = findTask(d.id); if (!t) return;
      openModal({
        title: 'Delete this mission?', body: '<p>' + esc(t.title) + ' will be removed from the board.</p>', confirm: 'Delete mission',
        onConfirm: function () { state.tasks = state.tasks.filter(function (x) { return x.id !== t.id; }); commit('Mission deleted'); }
      });
    },
    returnToBoard: function (d) {
      var t = findTask(d.id); if (!t) return;
      openModal({
        title: 'Return to board?', body: '<p>' + esc(t.title) + ' will be unassigned from ' + esc(nameOf(t.assignee)) + ' and reopened for any operative.</p>',
        confirm: 'Return to board',
        onConfirm: function () { t.status = 'open'; delete t.assignee; delete t.claimedAt; delete t.submittedAt; delete t.note; commit('Mission returned to the board'); }
      });
    },
    reopenTask: function (d) {
      var t = findTask(d.id); if (!t) return;
      state.tasks.unshift({ id: uid(), title: t.title, description: t.description, category: t.category, points: t.points, status: 'open', createdAt: nowISO() });
      commit('Mission reposted to the board');
    },

    editGoal: function () {
      var g = state.goals[ui.user] || { name: '', target: 200, blueprint: 'droid' };
      var tiles = Object.keys(BLUEPRINTS).map(function (k) {
        return '<label class="bp-tile"><input type="radio" name="bp" value="' + k + '"' + (g.blueprint === k ? ' checked' : '') + '>' +
          blueprintSVG(k, 4, [], BLUEPRINTS[k].label + ' blueprint') + '<span>' + BLUEPRINTS[k].label + '</span></label>';
      }).join('');
      openModal({
        title: state.goals[ui.user] ? 'Edit your goal' : 'Set a savings goal',
        body: '<label class="field">What are you saving for?<input name="name" required maxlength="40" value="' + esc(g.name) + '" placeholder="For example: Droid kit or Pet axolotl"></label>' +
          '<label class="field">Goal in credits<input name="target" type="number" min="1" step="1" required value="' + g.target + '">' +
          '<span class="hint">At ' + num(state.settings.pointsPerUnit) + ' credits per ' + esc(state.settings.currency) + '1.00.</span></label>' +
          '<fieldset class="bp-pick"><legend>Blueprint</legend>' + tiles + '</fieldset>',
        extra: state.goals[ui.user] ? '<button type="button" class="btn ghost" data-action="clearGoal">Remove goal</button>' : '',
        confirm: 'Save goal',
        onConfirm: function (f) {
          var name = f.name.value.trim(), target = parseInt(f.target.value, 10);
          var picked = f.querySelector('input[name="bp"]:checked');
          if (!name || !(target > 0)) { toast('Add a goal name and a credit amount.'); return false; }
          state.goals[ui.user] = { name: name, target: target, blueprint: picked ? picked.value : 'droid', seenStage: 0, setAt: nowISO() };
          commit('Blueprint loaded: ' + name);
        }
      });
    },
    clearGoal: function () {
      delete state.goals[ui.user];
      closeModal(); commit('Goal removed');
    },

    payout: function (d) {
      var m = user(d.id), bal = balance(d.id);
      openModal({
        title: 'Record payout for ' + m.name,
        body: '<p>In vault: ' + num(bal) + ' credits (' + money(bal) + ').</p>' +
          '<label class="field">Credits to pay out<input name="points" type="number" min="1" max="' + bal + '" step="1" value="' + bal + '" required></label>' +
          '<label class="field">Note (optional)<input name="note" maxlength="80" placeholder="For example: Goal reached, kit bought"></label>',
        confirm: 'Record payout',
        onConfirm: function (f) {
          var c = parseInt(f.points.value, 10);
          if (!c || c < 1 || c > bal) { toast('Enter between 1 and ' + num(bal) + ' credits.'); return false; }
          state.ledger.unshift({ id: uid(), userId: m.id, type: 'payout', source: 'payout', title: f.note.value.trim() || 'Payout recorded by Commander', points: c, at: nowISO() });
          commit('Payout recorded: ' + money(c) + ' to ' + m.name);
        }
      });
    },

    removeOperative: function (d) {
      var m = user(d.id); if (!m) return;
      var bal = balance(m.id);
      openModal({
        title: 'Remove ' + m.name + '?',
        body: '<p>' + esc(m.name) + ' will be removed from the squadron and their goal deleted. Any missions they have accepted go back on the board.</p>' +
          (bal > 0 ? '<p class="note">They still have ' + num(bal) + ' credits (' + money(bal) + ') in their vault. Record a payout first if you owe them.</p>' : ''),
        confirm: 'Remove operative',
        onConfirm: function () {
          state.tasks.forEach(function (t) {
            if (t.assignee === m.id && (t.status === 'in_progress' || t.status === 'pending')) {
              t.status = 'open'; delete t.assignee; delete t.claimedAt; delete t.submittedAt; delete t.note;
            }
          });
          delete state.goals[m.id];
          state.users = state.users.filter(function (u) { return u.id !== m.id; });
          if (ui.ledgerUser === m.id) ui.ledgerUser = 'all';
          commit(m.name + ' removed from the squadron');
        }
      });
    },

    exportData: function () {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'galactic-ops-backup-' + dateKey() + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      toast('Backup exported');
    },
    importData: function () { $('importFile').value = ''; $('importFile').click(); },
    resetData: function () {
      openModal({
        title: 'Reset and load sample data?', body: '<p>This replaces all missions, vaults, goals and history in this browser with fresh demo data.</p>',
        confirm: 'Reset data',
        onConfirm: function () { state = seedData(); ui.user = 'mgr'; ui.tab = 'dashboard'; ui.cat = 'All'; commit('Sample data loaded'); }
      });
    },
    clearData: function () {
      openModal({
        title: 'Start with an empty terminal?', body: '<p>Keeps names and the exchange rate. Removes all missions, reports, vault history and goals.</p>',
        confirm: 'Clear everything',
        onConfirm: function () { state.tasks = []; state.ledger = []; state.decisions = []; state.goals = {}; commit('Terminal cleared'); }
      });
    }
  };

  var forms = {
    addOperative: function (f) {
      var name = f.name.value.trim();
      if (!name) return toast('Add a name for the new operative.');
      if (operatives().length >= MAX_OPERATIVES) return toast('The squadron is full.');
      state.users.push({ id: 'u' + uid(), name: name, role: 'member' });
      commit(name + ' added to the squadron');
    },
    addTask: function (f) {
      var title = f.title.value.trim(), cat = f.category.value.trim(), c = parseInt(f.points.value, 10);
      if (!title || !cat || !(c > 0)) return toast('Add a title, category and credit reward.');
      state.tasks.unshift({ id: uid(), title: title, description: f.description.value.trim(), category: cat, points: c, status: 'open', createdAt: nowISO() });
      commit('Mission posted to the board');
    },
    settings: function (f) {
      var rate = parseInt(f.rate.value, 10);
      if (!(rate > 0)) return toast('Credits per 1.00 must be at least 1.');
      state.settings.pointsPerUnit = rate;
      state.settings.currency = f.currency.value.trim() || '$';
      state.settings.teamName = f.teamName.value.trim() || 'Squadron';
      state.users.forEach(function (u) { var i = f['name_' + u.id]; if (i && i.value.trim()) u.name = i.value.trim(); });
      commit('Settings saved');
    }
  };

  /* =========================================================
     Events
     ========================================================= */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (el && !el.disabled && actions[el.dataset.action]) { e.preventDefault(); actions[el.dataset.action](el.dataset, el); return; }
    if (e.target === $('modal')) closeModal();
  });
  document.addEventListener('submit', function (e) {
    var f = e.target;
    e.preventDefault();
    if (f.id === 'modalForm') {
      var h = modalHandler;
      if (h && h(f) === false) return;
      closeModal(); return;
    }
    if (forms[f.dataset.form]) forms[f.dataset.form](f);
  });
  document.addEventListener('change', function (e) {
    if (e.target.dataset.change === 'ledgerUser') { ui.ledgerUser = e.target.value; renderView(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });

  $('importFile').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.users) || !Array.isArray(data.tasks) || !data.settings) throw new Error('bad file');
        state = normalize(data); commit('Backup imported');
      } catch (err) { toast('That file is not a terminal backup. Choose a .json file exported from this app.'); }
    };
    reader.readAsText(file);
  });

  window.addEventListener('storage', function (e) {
    if (e.key === STORE_KEY && e.newValue) { state = normalize(JSON.parse(e.newValue)); render(); }
  });

  render();
})();
</script>
</body>
</html>
