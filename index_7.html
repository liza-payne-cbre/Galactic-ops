<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Galactic Ops Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2338bdf8' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23fbbf24'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ======================================================
   Galactic Ops Terminal, Rev 2
   ====================================================== */
:root{
  --bg:#0f172a;
  --panel:#131e36;
  --panel-deep:#0b1324;
  --line:rgba(56,189,248,.16);
  --line-strong:rgba(56,189,248,.42);
  --cyan:#38bdf8;
  --cyan-bright:#22d3ee;
  --cyan-wash:rgba(56,189,248,.10);
  --amber:#fbbf24;
  --amber-wash:rgba(251,191,36,.12);
  --text:#cbd5e1;
  --dim:#8fa1b8;
  --head:#e8f4ff;
  --font-display:"Chakra Petch","Segoe UI",Roboto,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:8px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.55 var(--font-body);-webkit-tap-highlight-color:transparent;
  background:radial-gradient(1200px 500px at 85% -10%,rgba(56,189,248,.10),transparent 60%),radial-gradient(900px 400px at -10% 110%,rgba(251,191,36,.05),transparent 60%),var(--bg);background-attachment:fixed}
h1,h2,h3{font-family:var(--font-display);color:var(--head);margin:0;font-weight:600;line-height:1.2;letter-spacing:.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button,select,label,input[type="checkbox"],input[type="radio"]{touch-action:manipulation}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header ---------- */
.topbar{position:relative;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;border-bottom:1px solid var(--line);
  background:
    radial-gradient(1px 1px at 12% 30%,rgba(255,255,255,.7),transparent),radial-gradient(1px 1px at 28% 70%,rgba(255,255,255,.5),transparent),
    radial-gradient(1.5px 1.5px at 46% 20%,rgba(255,255,255,.6),transparent),radial-gradient(1px 1px at 63% 60%,rgba(255,255,255,.5),transparent),
    radial-gradient(1px 1px at 78% 25%,rgba(255,255,255,.6),transparent),radial-gradient(1.5px 1.5px at 92% 75%,rgba(255,255,255,.5),transparent),
    linear-gradient(180deg,#0b1222,#0f172a)}
.brand{display:flex;align-items:center;gap:14px}
.sigil{width:44px;height:44px;flex:none}
.topbar h1{font-size:22px;color:var(--head)}
.rev{display:inline-block;margin-left:10px;padding:2px 8px;border:1px solid var(--amber);border-radius:4px;color:var(--amber);font:600 12px var(--font-display);vertical-align:3px}
.topbar .date{color:var(--dim);font-size:13px;margin-top:2px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who-label{font-size:13px;color:var(--dim);margin-right:4px}
.person{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:6px 18px 6px 6px;border-radius:28px;border:2px solid var(--line-strong);background:rgba(15,23,42,.6);color:var(--text);font-size:14px;cursor:pointer;text-align:left}
.person .avatar{width:42px;height:42px;font-size:14px}
.person[aria-pressed="true"]{border-color:var(--cyan);background:var(--cyan-wash);color:var(--head);box-shadow:0 0 18px rgba(56,189,248,.25)}
.person[aria-pressed="true"] .avatar{background:var(--cyan);color:var(--bg)}
.person:active{transform:scale(.97)}
.person .role{display:block;font-size:11px;color:var(--dim)}
.person[aria-pressed="true"] .role{color:var(--cyan)}

/* ---------- Profile strip ---------- */
.profile{border-bottom:1px solid var(--line);background:rgba(11,19,36,.55)}
.profile-inner{max-width:1240px;margin:0 auto;padding:18px 24px;display:grid;grid-template-columns:minmax(200px,1fr) auto auto;gap:16px 40px;align-items:center}
.identity{display:flex;align-items:center;gap:14px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--panel);border:2px solid var(--cyan);color:var(--cyan);display:grid;place-items:center;font:700 15px var(--font-display);flex:none}
.avatar.sm{width:36px;height:36px;font-size:12px}
.avatar.cmd{border-color:var(--amber);color:var(--amber)}
.identity h2{font-size:20px}
.identity p{font-size:13px;color:var(--dim)}
.vault{display:flex;flex-direction:column;gap:2px;padding-left:20px;border-left:3px solid var(--amber)}
.vault .lbl{font-size:12px;color:var(--dim)}
.vault .big{font:700 34px/1.05 var(--font-display);color:var(--amber);text-shadow:0 0 18px rgba(251,191,36,.35)}
.vault .big small{font-size:14px;font-weight:500;margin-left:6px;color:var(--dim);text-shadow:none}
.vault .equiv{font-size:12px;color:var(--cyan)}
.stats{display:flex;gap:28px;margin:0}
.stats div{display:flex;flex-direction:column}
.stats dt{font-size:12px;color:var(--dim)}
.stats dd{margin:0;font:700 20px var(--font-display);color:var(--head)}

/* ---------- Tabs ---------- */
.tabs-wrap{background:rgba(11,19,36,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(6px)}
.tabs{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;background:none;border:0;padding:0 20px;min-height:60px;cursor:pointer;color:var(--dim);font:500 15px var(--font-display);white-space:nowrap;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.tab[aria-selected="true"]{color:var(--head)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;background:var(--cyan);box-shadow:0 0 12px var(--cyan);border-radius:3px 3px 0 0}
.count{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--amber);color:var(--bg);font:700 12px var(--font-body);display:inline-grid;place-items:center}

/* ---------- Layout ---------- */
main{max-width:1240px;margin:0 auto;padding:22px 24px 56px}
.stack{display:grid;gap:20px}
.grid-2{display:grid;gap:20px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
.grid-2>*,.grid-3>*,.stack>*{min-width:0}
.grid-3{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));align-items:start}
.panel{background:linear-gradient(180deg,rgba(19,30,54,.95),rgba(15,24,44,.95));border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:inset 0 1px 0 rgba(56,189,248,.08)}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel h2{font-size:19px}
.panel h3{font-size:16px}
.sub{font-size:13px;margin-top:3px;color:var(--dim)}
.section-title{font-size:19px;margin:6px 0 12px}
.empty{padding:24px 16px;text-align:center;background:var(--panel-deep);border:1px dashed var(--line-strong);border-radius:6px;font-size:14px;color:var(--dim)}
.empty strong{display:block;color:var(--head);font:600 16px var(--font-display);margin-bottom:4px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:0 22px;border-radius:6px;border:2px solid var(--cyan);background:var(--cyan);color:#06111f;font:600 15px var(--font-display);letter-spacing:.02em;cursor:pointer;white-space:nowrap}
.btn.secondary{background:transparent;color:var(--cyan)}
.btn.ghost{background:transparent;border-color:var(--line-strong);color:var(--text)}
.btn.accent{background:var(--amber);border-color:var(--amber);color:#1a1204}
.btn.small{min-height:48px;padding:0 18px;font-size:14px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
@media (hover:hover){
  .btn:hover{box-shadow:0 0 16px rgba(56,189,248,.45)}
  .btn.accent:hover{box-shadow:0 0 16px rgba(251,191,36,.45)}
  .btn.ghost:hover,.btn.secondary:hover{background:var(--cyan-wash)}
}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- Chips and credits ---------- */
.chip{display:inline-flex;align-items:center;font-size:12px;line-height:1;padding:7px 11px;border-radius:999px;border:1px solid var(--line-strong);color:var(--dim);white-space:nowrap}
.chip.pending{border-color:var(--amber);color:var(--amber);background:var(--amber-wash)}
.chip.approved{background:var(--cyan);border-color:var(--cyan);color:#06111f;font-weight:600}
.chip.progress{background:var(--cyan-wash);border-color:transparent;color:var(--cyan)}
.chip.returned{border-style:dashed;color:var(--text)}
.cr{font:700 15px var(--font-display);color:var(--amber);white-space:nowrap}
.cr.neg{color:var(--dim)}
.note{display:block;margin-top:8px;padding:8px 12px;border-left:3px solid var(--amber);background:var(--amber-wash);font-size:13px;color:var(--text)}

/* ---------- Rows ---------- */
.rows{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:4px}
.row-title{color:var(--head);font-weight:600;font-size:16px}
.row-meta{font-size:13px;color:var(--dim);display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center;margin-top:4px}
.row-actions{display:flex;gap:12px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.who-line{display:flex;align-items:center;gap:12px}

/* ---------- Mission board ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.filter{min-height:48px;padding:0 22px;border-radius:999px;border:2px solid var(--line-strong);background:transparent;color:var(--text);font:500 14px var(--font-display);cursor:pointer}
.filter[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#06111f}
.filter:active{transform:scale(.97)}
.tickets{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.ticket{display:grid;grid-template-columns:100px minmax(0,1fr);background:var(--panel-deep);border:1px solid var(--line-strong);border-radius:var(--r);overflow:hidden}
.stub{background:linear-gradient(180deg,rgba(251,191,36,.10),rgba(251,191,36,.02));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 8px;text-align:center;border-right:2px dashed var(--line-strong)}
.stub-cr{font:700 30px/1 var(--font-display);color:var(--amber);text-shadow:0 0 14px rgba(251,191,36,.4)}
.stub-unit{font-size:11px;color:var(--dim);margin-top:4px}
.stub-money{margin-top:10px;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--cyan);color:var(--cyan)}
.ticket-body{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.ticket-body h3{font-size:17px}
.ticket-body p{font-size:14px;color:var(--dim)}
.cat{font:600 12px var(--font-display);color:var(--cyan);letter-spacing:.04em}
.ticket-foot{margin-top:auto;padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* ---------- Goal and Blueprint Bay (signature element) ---------- */
.bay{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:24px;align-items:center;border-color:var(--line-strong)}
.bay-visual{position:relative;border:1px solid var(--line-strong);border-radius:var(--r);background:radial-gradient(circle at 50% 60%,rgba(56,189,248,.12),rgba(11,19,36,.95) 70%);aspect-ratio:1/1;overflow:hidden}
.bay-visual::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(56,189,248,.04) 0 2px,transparent 2px 5px)}
.bay-visual svg{display:block;width:100%;height:100%}
.bay-tag{position:absolute;left:10px;top:10px;font:600 12px var(--font-display);color:var(--cyan);background:rgba(11,19,36,.8);border:1px solid var(--line-strong);border-radius:4px;padding:3px 8px;z-index:1}
.bay-tag.done{color:var(--amber);border-color:var(--amber)}
.goal-name{font:700 26px/1.15 var(--font-display);color:var(--amber);margin:6px 0 14px;text-shadow:0 0 16px rgba(251,191,36,.25)}
.meter{position:relative;height:18px;border-radius:9px;background:var(--panel-deep);border:1px solid var(--line-strong);overflow:hidden}
.meter-fill{height:100%;background:linear-gradient(90deg,#0ea5e9,var(--cyan-bright));box-shadow:0 0 14px rgba(34,211,238,.6);border-radius:9px;transition:width .8s ease}
.meter-fill.full{background:linear-gradient(90deg,#f59e0b,var(--amber));box-shadow:0 0 14px rgba(251,191,36,.6)}
.meter-ticks span{position:absolute;top:0;bottom:0;width:2px;background:rgba(11,19,36,.9)}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 0;font-size:13px;color:var(--dim)}
.meter-row strong{font:700 22px var(--font-display);color:var(--head)}
.goal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}
.goal-stats div{background:var(--panel-deep);border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:12px;color:var(--dim)}
.goal-stats strong{display:block;font:700 19px var(--font-display);color:var(--head)}
.stages{list-style:none;margin:0 0 16px;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stage{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;border:1px dashed var(--line-strong);font-size:13px;color:var(--dim)}
.stage b{font:600 12px var(--font-display);min-width:38px;color:var(--dim)}
.stage.on{border-style:solid;border-color:var(--cyan);background:var(--cyan-wash);color:var(--head)}
.stage.on b{color:var(--cyan)}
.stage .lock{margin-left:auto;font-size:12px;white-space:nowrap}
.mini-goal{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.mini-goal .bay-visual{aspect-ratio:1/1}
.mini-goal .goal-line{font:600 14px var(--font-display);color:var(--amber);margin-bottom:6px}
.mini-goal .meter{height:10px}

/* Blueprint SVG layers */
.bp .ghost *{fill:none!important;stroke:rgba(56,189,248,.55)!important;stroke-width:1.4!important;stroke-dasharray:5 4;filter:none!important}
.bp .lit *{stroke:#081020;stroke-width:2;stroke-linejoin:round}
.bp .lit .ln{fill:none}
.bp .f-light{fill:#e2e8f0}.bp .f-panel{fill:#94a3b8}.bp .f-dark{fill:#1e293b}.bp .f-mid{fill:#64748b}
.bp .f-amber{fill:#fbbf24}.bp .f-visor{fill:#22d3ee}.bp .f-white{fill:#ffffff}.bp .f-ink{fill:#0f172a}
.bp .f-pink{fill:#f9a8d4}.bp .f-pinkdark{fill:#f472b6}.bp .f-gill{fill:#db2777}.bp .f-blush{fill:#fb7185}
.bp .lit .ln.s-ink{stroke:#0f172a;stroke-width:3;stroke-linecap:round}
.bp .lit .ln.s-pink{stroke:#ec4899;stroke-width:2.5;stroke-linecap:round}
.bp .lit .ln.s-mid{stroke:#64748b;stroke-width:3;stroke-linecap:round}
.bp .arrive{animation:arrive 1s cubic-bezier(.2,.9,.3,1.25) both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes arrive{0%{opacity:0;transform:translateY(-18px) scale(.85);filter:drop-shadow(0 0 0 rgba(34,211,238,0))}60%{opacity:1;filter:drop-shadow(0 0 10px rgba(34,211,238,.9))}100%{opacity:1;transform:none;filter:drop-shadow(0 0 0 rgba(34,211,238,0))}}

/* Blueprint picker in goal form */
.bp-pick{border:0;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bp-pick legend{font-size:13px;color:var(--dim);margin-bottom:8px;padding:0}
.bp-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:2px solid var(--line-strong);border-radius:8px;cursor:pointer;font:600 14px var(--font-display);color:var(--text);min-height:52px}
.bp-tile svg{width:100%;max-width:120px;aspect-ratio:1/1}
.bp-tile input{position:absolute;opacity:0;pointer-events:none}
.bp-tile:has(input:checked){border-color:var(--amber);background:var(--amber-wash);color:var(--amber)}
.bp-tile:has(input:focus-visible){outline:3px solid var(--amber);outline-offset:2px}

/* ---------- Forms ---------- */
.form-grid{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
label.field{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--dim)}
.field input,.field select,.field textarea{width:100%;min-height:52px;padding:12px 14px;border:2px solid var(--line-strong);border-radius:6px;background:var(--panel-deep);color:var(--head);font-size:16px}
.field textarea{min-height:84px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:#5b6b82}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--cyan);outline:none;box-shadow:0 0 0 3px rgba(56,189,248,.2)}
.hint{font-size:12px;color:var(--dim)}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
thead th{background:rgba(56,189,248,.12);color:var(--cyan);text-align:left;font:600 13px var(--font-display);letter-spacing:.03em;padding:12px 14px;white-space:nowrap;border-bottom:1px solid var(--line-strong)}
tbody td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even){background:rgba(255,255,255,.02)}
td.num,th.num{text-align:right;white-space:nowrap}

/* ---------- Rate ---------- */
.rate{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.rate-figure{font:700 28px var(--font-display);color:var(--head)}
.rate-figure .eq{color:var(--cyan);margin:0 8px}
.rate-figure .c{color:var(--amber)}
.rate p{font-size:13px;color:var(--dim)}

/* ---------- Commander team cards ---------- */
.member-card .mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mini-stats div{font-size:11px;color:var(--dim)}
.mini-stats strong{display:block;font:700 18px var(--font-display);color:var(--head)}

/* ---------- Modal and toast ---------- */
.modal{position:fixed;inset:0;background:rgba(2,6,18,.72);display:grid;place-items:center;padding:20px;z-index:50;backdrop-filter:blur(3px)}
.modal[hidden]{display:none}
.modal-card{background:var(--panel);border:1px solid var(--line-strong);border-radius:var(--r);width:100%;max-width:540px;max-height:calc(100vh - 40px);overflow:auto;padding:26px;box-shadow:0 0 40px rgba(56,189,248,.18)}
.modal-card h2{font-size:20px;margin-bottom:12px}
.modal-body{display:grid;gap:14px;font-size:15px}
.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px;flex-wrap:wrap}
.modal-actions .btn{min-width:130px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--panel);border:1px solid var(--cyan);color:var(--head);padding:16px 24px;border-radius:6px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 0 24px rgba(56,189,248,.35)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Responsive ---------- */
@media (max-width:1000px){
  .profile-inner{grid-template-columns:1fr auto}
  .profile-inner .stats{grid-column:1/-1}
}
@media (max-width:900px){
  .grid-2{grid-template-columns:1fr}
  .bay{grid-template-columns:minmax(220px,280px) minmax(0,1fr)}
}
@media (max-width:700px){
  .bay{grid-template-columns:1fr}
  .bay-visual{max-width:340px;width:100%;margin:0 auto}
  .stages{grid-template-columns:1fr}
}
@media (max-width:640px){
  .topbar{padding:12px 16px}
  .topbar h1{font-size:19px}
  .who{width:100%;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .who-label{display:none}
  .person{flex:none}
  .profile-inner{grid-template-columns:1fr;padding:16px}
  main{padding:16px 16px 44px}
  .panel{padding:16px}
  .form-grid{grid-template-columns:1fr}
  .row{grid-template-columns:1fr}
  .row-actions{justify-content:flex-start}
  .tickets{grid-template-columns:1fr}
  .ticket{grid-template-columns:84px minmax(0,1fr)}
  .goal-stats{grid-template-columns:1fr 1fr 1fr;gap:8px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
